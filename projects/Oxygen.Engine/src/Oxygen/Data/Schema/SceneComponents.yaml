# The authored scene node components and their properties, declared once.
#
# SceneComponents.schema.json validates this file. The Scene build generates
# Generated.SceneComponents.h from it: the component ids and the field ids that
# property edits address, the override ids, and each property's default and
# range. Other consumers generate their own code from it.
#
# Field sets are the component-local field ids. A component names its field
# set; point and spot lights share one. Ids are stable: never renumber or reuse
# one. A property is addressed by its component kind and key (a JSON pointer
# into the component's authored record) and has one value type. The fields of
# a property receive its value in order, one value each: a bool as a bool, an
# int or an enum member's wire value as an int32, a float or each axis of a
# vec3 as a float. `encoding` names a unit conversion applied before the value
# goes to its fields: `degrees-to-radians` converts one angle;
# `euler-xyz-degrees-to-quat` turns three X-Y-Z Euler angles into one rotation,
# which a change holds as a quaternion while the fields receive the angles.
#
# The schema is the only place that decides a property's creation `default`
# and its valid `range`, both in the property's authored units. A range bounds
# each component of a vec3 alike; an absent `min` or `max` is unlimited. Every
# float and vec3 value is finite, and every enum value a declared member.
# `commit: clamp` lets a commit of outside data (an inspector edit, a model
# import) clamp a finite value into the range; loading and cooking reject it. A rule relating two properties is not a range:
# it stays in the component's rules. `unit` names the unit of the stored value;
# `display_unit` the unit UIs show it in.
# An asset property names the `asset_type` of the asset it references.
#
# Every property a scene can change on an instanced node has an `override_id`:
# every wired property, and every property with `sources`. A property with
# `sources: [asset]` is supplied by a geometry asset; a scene stores only its
# overrides of it. Override ids are stable and unique across the schema:
# never renumber or reuse one. A part is a piece of a component that the asset
# defining it identifies, such as a surface of a geometry; its properties
# always have a source and are never applied field by field.

version: 2

units:
  - { id: metre, abbreviation: m, name: metres }
  - { id: degree, abbreviation: "°", name: degrees }
  - { id: radian, abbreviation: rad, name: radians }
  - { id: lux, abbreviation: lx, name: lux }
  - { id: lumen, abbreviation: lm, name: lumens }
  - { id: exposure-value, abbreviation: EV, name: exposure value }
  - { id: per-second, abbreviation: 1/s, name: per second }
  - { id: per-metre, abbreviation: 1/m, name: per metre }
  - { id: f-number, abbreviation: f/, name: f-number }
  - { id: multiplier, abbreviation: x, name: multiplier }

# Enumerations with their wire values. Node flag source modes: Inherit takes
# the parent's resolved value, the others are local values.
enums:
  - name: VisibilitySource
    members:
      - { name: Inherit, value: 0 }
      - { name: Shown, value: 1 }
      - { name: Hidden, value: 2 }

  # Quoted: YAML 1.1 readers take a bare On or Off for a boolean.
  - name: ShadowSource
    members:
      - { name: Inherit, value: 0 }
      - { name: "On", value: 1 }
      - { name: "Off", value: 2 }

  - name: CameraAspectMode
    members:
      - { name: Auto, value: 0 }
      - { name: Fixed, value: 1 }

  - name: AtmosphereLightSlot
    members:
      - { name: None, value: 0 }
      - { name: Primary, value: 1 }
      - { name: Secondary, value: 2 }

  - name: ShadowResolutionHint
    members:
      - { name: Low, value: 0 }
      - { name: Medium, value: 1 }
      - { name: High, value: 2 }
      - { name: Ultra, value: 3 }

  - name: DirectionalCsmSplitMode
    members:
      - { name: Generated, value: 0 }
      - { name: ManualDistances, value: 1 }

field_sets:
  - name: Transform
    fields:
      - { name: PositionX, id: 0 }
      - { name: PositionY, id: 1 }
      - { name: PositionZ, id: 2 }
      - { name: RotationXDegrees, id: 3 }
      - { name: RotationYDegrees, id: 4 }
      - { name: RotationZDegrees, id: 5 }
      - { name: ScaleX, id: 6 }
      - { name: ScaleY, id: 7 }
      - { name: ScaleZ, id: 8 }

  - name: Node
    fields:
      - { name: Visible, id: 0 }
      - { name: CastsShadows, id: 1 }
      - { name: ReceivesShadows, id: 2 }
      - { name: Static, id: 3 }
      - { name: RayCastingSelectable, id: 4 }
      - { name: IgnoreParentTransform, id: 5 }

  - name: PerspectiveCamera
    fields:
      - { name: FieldOfViewYRadians, id: 0 }
      - { name: AspectRatio, id: 1 }
      - { name: NearPlane, id: 2 }
      - { name: FarPlane, id: 3 }
      - { name: ApertureF, id: 4 }
      - { name: ShutterRate, id: 5 }
      - { name: Iso, id: 6 }
      - { name: AspectMode, id: 7 }

  - name: OrthographicCamera
    fields:
      - { name: OrthographicSize, id: 0 }
      - { name: AspectRatio, id: 1 }
      - { name: NearPlane, id: 2 }
      - { name: FarPlane, id: 3 }
      - { name: ApertureF, id: 4 }
      - { name: ShutterRate, id: 5 }
      - { name: Iso, id: 6 }
      - { name: AspectMode, id: 7 }

  # The light fields common to every light keep the same ids in
  # DirectionalLight and LocalLight.
  - name: DirectionalLight
    fields:
      - { name: ColorR, id: 0 }
      - { name: ColorG, id: 1 }
      - { name: ColorB, id: 2 }
      - { name: AffectsWorld, id: 3 }
      - { name: CastsShadows, id: 5 }
      - { name: ShadowBias, id: 6 }
      - { name: ShadowNormalBias, id: 7 }
      - { name: ContactShadows, id: 8 }
      - { name: ShadowResolutionHint, id: 9 }
      - { name: ExposureCompensation, id: 10 }
      - { name: IntensityLux, id: 11 }
      - { name: AngularSizeRadians, id: 12 }
      - { name: CascadeCount, id: 15 }
      - { name: SplitMode, id: 16 }
      - { name: MaxShadowDistance, id: 17 }
      - { name: CascadeDistance0, id: 18 }
      - { name: CascadeDistance1, id: 19 }
      - { name: CascadeDistance2, id: 20 }
      - { name: CascadeDistance3, id: 21 }
      - { name: DistributionExponent, id: 22 }
      - { name: TransitionFraction, id: 23 }
      - { name: DistanceFadeoutFraction, id: 24 }
      - { name: AtmosphereLightSlot, id: 25 }
      - { name: UsePerPixelAtmosphereTransmittance, id: 26 }
      - { name: DiskScaleR, id: 27 }
      - { name: DiskScaleG, id: 28 }
      - { name: DiskScaleB, id: 29 }

  - name: LocalLight
    fields:
      - { name: ColorR, id: 0 }
      - { name: ColorG, id: 1 }
      - { name: ColorB, id: 2 }
      - { name: AffectsWorld, id: 3 }
      - { name: CastsShadows, id: 5 }
      - { name: ShadowBias, id: 6 }
      - { name: ShadowNormalBias, id: 7 }
      - { name: ContactShadows, id: 8 }
      - { name: ShadowResolutionHint, id: 9 }
      - { name: ExposureCompensation, id: 10 }
      - { name: LuminousFluxLm, id: 11 }
      - { name: Range, id: 12 }
      - { name: SourceRadius, id: 13 }
      - { name: InnerConeAngleRadians, id: 14 }
      - { name: OuterConeAngleRadians, id: 15 }

  - name: LocalFogVolume
    fields:
      - { name: Enabled, id: 0 }
      - { name: RadialFogExtinction, id: 1 }
      - { name: HeightFogExtinction, id: 2 }
      - { name: HeightFogFalloff, id: 3 }
      - { name: HeightFogOffset, id: 4 }
      - { name: FogPhaseG, id: 5 }
      - { name: FogAlbedoR, id: 6 }
      - { name: FogAlbedoG, id: 7 }
      - { name: FogAlbedoB, id: 8 }
      - { name: FogEmissiveR, id: 9 }
      - { name: FogEmissiveG, id: 10 }
      - { name: FogEmissiveB, id: 11 }
      - { name: SortPriority, id: 12 }

# A component with `wire` is applied to the engine node field by field; its id
# is the component id. A component without one is applied whole. Every node has
# exactly one of each `required` component, and at most one of each `optional`
# component.
components:
  # The node name; renamed by its own command, never field by field.
  - name: Metadata
    kind: metadata
    cardinality: required
    properties:
      - name: Name
        key: /name
        type: string

  # Parent and children are structure, edited by hierarchy commands.
  - name: Hierarchy
    kind: hierarchy
    cardinality: required
    properties: []

  - name: Transform
    kind: transform
    cardinality: required
    wire: { id: 1, field_set: Transform }
    properties:
      - name: PositionX
        key: /local_position/0
        type: float
        fields: [PositionX]
        override_id: 5
        default: 0
        unit: metre
      - name: PositionY
        key: /local_position/1
        type: float
        fields: [PositionY]
        override_id: 6
        default: 0
        unit: metre
      - name: PositionZ
        key: /local_position/2
        type: float
        fields: [PositionZ]
        override_id: 7
        default: 0
        unit: metre
      # One rotation: a cooked node holds a quaternion, and one angle of it
      # exists only through an ambiguous decomposition.
      - name: Rotation
        key: /local_rotation_euler_degrees
        type: vec3
        fields: [RotationXDegrees, RotationYDegrees, RotationZDegrees]
        override_id: 8
        encoding: euler-xyz-degrees-to-quat
        default: [0, 0, 0]
        unit: degree
      - name: ScaleX
        key: /local_scale/0
        type: float
        fields: [ScaleX]
        override_id: 9
        default: 1
        range: { nonzero: true }
        unit: multiplier
      - name: ScaleY
        key: /local_scale/1
        type: float
        fields: [ScaleY]
        override_id: 10
        default: 1
        range: { nonzero: true }
        unit: multiplier
      - name: ScaleZ
        key: /local_scale/2
        type: float
        fields: [ScaleZ]
        override_id: 11
        default: 1
        range: { nonzero: true }
        unit: multiplier

  # The authored flags of every node. A new child takes `default` (Inherit), a
  # new root takes `root_default`, and an Inherit root resolves to it.
  - name: Node
    kind: node-flags
    cardinality: required
    wire: { id: 7, field_set: Node }
    properties:
      - name: Visibility
        key: /visible
        type: enum
        enum: VisibilitySource
        fields: [Visible]
        override_id: 12
        default: Inherit
        root_default: Shown
      - name: CastsShadows
        key: /casts_shadows
        type: enum
        enum: ShadowSource
        fields: [CastsShadows]
        override_id: 13
        default: Inherit
        root_default: "On"
      - name: ReceivesShadows
        key: /receives_shadows
        type: enum
        enum: ShadowSource
        fields: [ReceivesShadows]
        override_id: 14
        default: Inherit
        root_default: "On"
      - name: IsStatic
        key: /static
        type: bool
        fields: [Static]
        override_id: 15
        default: false
      - name: IsRayCastingSelectable
        key: /ray_cast_selectable
        type: bool
        fields: [RayCastingSelectable]
        override_id: 16
        default: true
      - name: IgnoreParentTransform
        key: /ignore_parent_transform
        type: bool
        fields: [IgnoreParentTransform]
        override_id: 17
        default: false

  # The asset defaults of the surfaces and the LOD policy come from the
  # geometry asset; the defaults here are what an asset that sets none uses.
  - name: Geometry
    kind: geometry
    cardinality: optional
    properties:
      - name: GeometryUri
        key: /geometry_uri
        type: asset
        asset_type: geometry
      - name: LodPolicy
        key: /lod_policy
        type: lod-policy
        sources: [asset]
        override_id: 4
        default: { type: fixed, lod_index: 0 }
    parts:
      - name: Surface
        kind: surface
        properties:
          - name: Material
            key: /material
            type: asset
            asset_type: material
            sources: [asset]
            override_id: 1
          - name: Visibility
            key: /visible
            type: bool
            sources: [asset]
            override_id: 2
            default: true
          - name: CastsShadows
            key: /casts_shadows
            type: bool
            sources: [asset]
            override_id: 3
            default: true

  - name: PerspectiveCamera
    kind: perspective-camera
    cardinality: optional
    wire: { id: 2, field_set: PerspectiveCamera }
    properties:
      - name: FieldOfViewDegrees
        key: /field_of_view_degrees
        type: float
        fields: [FieldOfViewYRadians]
        override_id: 18
        encoding: degrees-to-radians
        default: 60
        range: { min: 1, max: 179 }
        commit: clamp
        unit: degree
      - name: AspectRatio
        key: /aspect_ratio
        type: float
        fields: [AspectRatio]
        override_id: 19
        default: 1.7777778
        range: { min: 0, min_exclusive: true }
      - name: NearPlane
        key: /near_plane
        type: float
        fields: [NearPlane]
        override_id: 20
        default: 0.1
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: FarPlane
        key: /far_plane
        type: float
        fields: [FarPlane]
        override_id: 21
        default: 1000
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: ApertureF
        key: /aperture_f
        type: float
        fields: [ApertureF]
        override_id: 22
        default: 11
        range: { min: 0, min_exclusive: true }
        unit: f-number
      - name: ShutterRate
        key: /shutter_rate
        type: float
        fields: [ShutterRate]
        override_id: 23
        default: 125
        range: { min: 0, min_exclusive: true }
        unit: per-second
      - name: Iso
        key: /iso
        type: float
        fields: [Iso]
        override_id: 24
        default: 100
        range: { min: 0, min_exclusive: true }
      - name: AspectMode
        key: /aspect_mode
        type: enum
        enum: CameraAspectMode
        fields: [AspectMode]
        override_id: 25
        default: Auto

  - name: OrthographicCamera
    kind: orthographic-camera
    cardinality: optional
    wire: { id: 4, field_set: OrthographicCamera }
    properties:
      - name: OrthographicSize
        key: /orthographic_size
        type: float
        fields: [OrthographicSize]
        override_id: 26
        default: 10
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: AspectMode
        key: /aspect_mode
        type: enum
        enum: CameraAspectMode
        fields: [AspectMode]
        override_id: 27
        default: Auto
      - name: AspectRatio
        key: /aspect_ratio
        type: float
        fields: [AspectRatio]
        override_id: 28
        default: 1.7777778
        range: { min: 0, min_exclusive: true }
      - name: NearPlane
        key: /near_plane
        type: float
        fields: [NearPlane]
        override_id: 29
        default: 0.1
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: FarPlane
        key: /far_plane
        type: float
        fields: [FarPlane]
        override_id: 30
        default: 1000
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: ApertureF
        key: /aperture_f
        type: float
        fields: [ApertureF]
        override_id: 31
        default: 11
        range: { min: 0, min_exclusive: true }
        unit: f-number
      - name: ShutterRate
        key: /shutter_rate
        type: float
        fields: [ShutterRate]
        override_id: 32
        default: 125
        range: { min: 0, min_exclusive: true }
        unit: per-second
      - name: Iso
        key: /iso
        type: float
        fields: [Iso]
        override_id: 33
        default: 100
        range: { min: 0, min_exclusive: true }

  - name: DirectionalLight
    kind: directional-light
    cardinality: optional
    wire: { id: 3, field_set: DirectionalLight }
    properties:
      - name: Color
        key: /color
        type: vec3
        fields: [ColorR, ColorG, ColorB]
        override_id: 34
        default: [1, 1, 1]
        range: { min: 0, max: 1 }
        commit: clamp
      - name: IntensityLux
        key: /intensity_lux
        type: float
        fields: [IntensityLux]
        override_id: 35
        default: 100000
        range: { min: 0 }
        commit: clamp
        unit: lux
      - name: AtmosphereSlot
        key: /atmosphere_light_slot
        type: enum
        enum: AtmosphereLightSlot
        fields: [AtmosphereLightSlot]
        override_id: 36
        default: None
      - name: UsePerPixelAtmosphereTransmittance
        key: /use_per_pixel_atmosphere_transmittance
        type: bool
        fields: [UsePerPixelAtmosphereTransmittance]
        override_id: 37
        default: false
      - name: CastsShadows
        key: /casts_shadows
        type: bool
        fields: [CastsShadows]
        override_id: 38
        default: true
      - name: AffectsWorld
        key: /affects_world
        type: bool
        fields: [AffectsWorld]
        override_id: 39
        default: true
      - name: AngularSizeRadians
        key: /angular_size_radians
        type: float
        fields: [AngularSizeRadians]
        override_id: 40
        default: 0.00935
        range: { min: 0, max: 3.14159265 }
        commit: clamp
        unit: radian
      - name: ExposureCompensation
        key: /exposure_compensation
        type: float
        fields: [ExposureCompensation]
        override_id: 41
        default: 0
        range: { min: -10, max: 10 }
        commit: clamp
        unit: exposure-value
      - name: AtmosphereDiskLuminanceScaleRgb
        key: /atmosphere_disk_luminance_scale_rgb
        type: vec3
        fields: [DiskScaleR, DiskScaleG, DiskScaleB]
        override_id: 42
        default: [1, 1, 1]
        range: { min: 0 }
        unit: multiplier
      - name: ShadowBias
        key: /shadow/bias
        type: float
        fields: [ShadowBias]
        override_id: 43
        default: 0
        range: { min: 0, max: 10 }
        commit: clamp
      - name: ShadowNormalBias
        key: /shadow/normal_bias
        type: float
        fields: [ShadowNormalBias]
        override_id: 44
        default: 0.02
        range: { min: 0 }
        commit: clamp
        unit: metre
      - name: ContactShadows
        key: /shadow/contact_shadows
        type: bool
        fields: [ContactShadows]
        override_id: 45
        default: false
      - name: ShadowResolutionHint
        key: /shadow/resolution_hint
        type: enum
        enum: ShadowResolutionHint
        fields: [ShadowResolutionHint]
        override_id: 46
        default: Medium
      - name: CascadeCount
        key: /csm/cascade_count
        type: int
        fields: [CascadeCount]
        override_id: 47
        default: 4
        range: { min: 1, max: 4 }
      - name: SplitMode
        key: /csm/split_mode
        type: enum
        enum: DirectionalCsmSplitMode
        fields: [SplitMode]
        override_id: 48
        default: Generated
      - name: MaxShadowDistance
        key: /csm/max_shadow_distance
        type: float
        fields: [MaxShadowDistance]
        override_id: 49
        default: 160
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: CascadeDistance0
        key: /csm/cascade_distances/0
        type: float
        fields: [CascadeDistance0]
        override_id: 50
        default: 8
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: CascadeDistance1
        key: /csm/cascade_distances/1
        type: float
        fields: [CascadeDistance1]
        override_id: 51
        default: 24
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: CascadeDistance2
        key: /csm/cascade_distances/2
        type: float
        fields: [CascadeDistance2]
        override_id: 52
        default: 64
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: CascadeDistance3
        key: /csm/cascade_distances/3
        type: float
        fields: [CascadeDistance3]
        override_id: 53
        default: 160
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: DistributionExponent
        key: /csm/distribution_exponent
        type: float
        fields: [DistributionExponent]
        override_id: 54
        default: 3
        range: { min: 1 }
      - name: TransitionFraction
        key: /csm/transition_fraction
        type: float
        fields: [TransitionFraction]
        override_id: 55
        default: 0.1
        range: { min: 0, max: 1 }
      - name: DistanceFadeoutFraction
        key: /csm/distance_fadeout_fraction
        type: float
        fields: [DistanceFadeoutFraction]
        override_id: 56
        default: 0.1
        range: { min: 0, max: 1 }

  - name: PointLight
    kind: point-light
    cardinality: optional
    wire: { id: 5, field_set: LocalLight }
    properties:
      - name: Color
        key: /color
        type: vec3
        fields: [ColorR, ColorG, ColorB]
        override_id: 57
        default: [1, 1, 1]
        range: { min: 0, max: 1 }
        commit: clamp
      - name: AffectsWorld
        key: /affects_world
        type: bool
        fields: [AffectsWorld]
        override_id: 58
        default: true
      - name: CastsShadows
        key: /casts_shadows
        type: bool
        fields: [CastsShadows]
        override_id: 59
        default: true
      - name: ExposureCompensation
        key: /exposure_compensation
        type: float
        fields: [ExposureCompensation]
        override_id: 60
        default: 0
        range: { min: -10, max: 10 }
        commit: clamp
        unit: exposure-value
      - name: ShadowBias
        key: /shadow/bias
        type: float
        fields: [ShadowBias]
        override_id: 61
        default: 0
        range: { min: 0, max: 10 }
        commit: clamp
      - name: ShadowNormalBias
        key: /shadow/normal_bias
        type: float
        fields: [ShadowNormalBias]
        override_id: 62
        default: 0.02
        range: { min: 0 }
        commit: clamp
        unit: metre
      - name: ContactShadows
        key: /shadow/contact_shadows
        type: bool
        fields: [ContactShadows]
        override_id: 63
        default: false
      - name: ShadowResolutionHint
        key: /shadow/resolution_hint
        type: enum
        enum: ShadowResolutionHint
        fields: [ShadowResolutionHint]
        override_id: 64
        default: Medium
      - name: LuminousFluxLumens
        key: /luminous_flux_lm
        type: float
        fields: [LuminousFluxLm]
        override_id: 65
        default: 1600
        range: { min: 0, min_exclusive: true }
        unit: lumen
      - name: Range
        key: /range
        type: float
        fields: [Range]
        override_id: 66
        default: 20
        range: { min: 0, min_exclusive: true }
        unit: metre
      - name: SourceRadius
        key: /source_radius
        type: float
        fields: [SourceRadius]
        override_id: 67
        default: 0
        range: { min: 0 }
        unit: metre

  - name: SpotLight
    kind: spot-light
    cardinality: optional
    wire: { id: 6, field_set: LocalLight }
    properties:
      - name: Color
        key: /color
        type: vec3
        fields: [ColorR, ColorG, ColorB]
        override_id: 68
        default: [1, 1, 1]
        range: { min: 0, max: 1 }
        commit: clamp
      - name: AffectsWorld
        key: /affects_world
        type: bool
        fields: [AffectsWorld]
        override_id: 69
        default: true
      - name: CastsShadows
        key: /casts_shadows
        type: bool
        fields: [CastsShadows]
        override_id: 70
        default: true
      - name: ExposureCompensation
        key: /exposure_compensation
