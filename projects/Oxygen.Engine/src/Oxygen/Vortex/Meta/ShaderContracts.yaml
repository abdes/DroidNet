# ------------------------------------------------------------------------------
# Source of truth for the Vortex structs shared by C++ and HLSL.
# ------------------------------------------------------------------------------
# BindlessCodeGen (python -m bindless_codegen.contracts) generates, per file
# below, a C++ header under src/ and an HLSL header under the shader root. The
# Vortex build regenerates them when this file or the generator changes.
#
# Layouts:
#   structured  StructuredBuffer element: members aligned to their scalar size.
#   constant    cbuffer or ConstantBuffer<T>: no member straddles a 16-byte
#               register; arrays, matrices and structs start one.
#   bytes       ByteAddressBuffer record: 32-bit scalars, vectors and nested
#               byte records; byte offsets and Load/Store functions are
#               generated.
# Every layout needs explicit padding: a member that would need implicit
# padding, or fields that do not add up to `size`, fail generation.
#
# Fields:
#   type     HLSL type, or a contract struct defined earlier.
#   count    array length.
#   slot     a bindless index into the named domain of Bindless.yaml, or `any`
#            for descriptor kinds without a domain (UAVs); invalid by default
#            and in the HLSL MakeInvalid<Struct>().
#   cpp      C++ type when it is not the default mapping (strong types).
#   default  C++ member initializer.
# A `loader` emits a domain-checked HLSL TryLoad<Struct>; `array: true` adds
# an element index checked against the buffer size.
# ------------------------------------------------------------------------------
meta:
  version: "1.0.0"

files:
  # --- View -------------------------------------------------------------------
  - id: view_constants
    cpp: Oxygen/Vortex/Types/Generated.ViewConstants.h
    hlsl: Vortex/Contracts/View/Generated.ViewConstants.hlsli
    namespace: oxygen::vortex
    cpp_includes:
      - <Oxygen/Vortex/Types/BindlessSlots.h>
    structs:
      - name: ViewConstantsGpuData
        hlsl_name: ViewConstants
        doc: |-
          Camera view constants, bound as b1 by every camera pass. Each write
          is a new transient record; the routing slot leads to the view's
          other per-frame records.
        layout: constant
        register: b1
        size: 256
        align: 16
        fields:
          - { name: frame_seq_num, type: uint64_t }
          - { name: frame_slot, type: uint }
          - { name: time_seconds, type: float }
          - { name: view_matrix, type: float4x4 }
          - { name: projection_matrix, type: float4x4 }
          - { name: inverse_view_projection_matrix, type: float4x4 }
          - { name: camera_position, type: float3 }
          - { name: _pad0, type: float }
          - {
              name: bindless_view_frame_bindings_slot,
              type: uint,
              slot: srv_global,
              cpp: BindlessViewFrameBindingsSlot,
            }
          - { name: reverse_z, type: uint, default: "1U" }
          - { name: is_orthographic, type: uint }
          - { name: _pad1, type: uint }
          - { name: _pad2, type: float4 }

  - id: view
    cpp: Oxygen/Vortex/Types/Generated.ViewContracts.h
    hlsl: Vortex/Contracts/View/Generated.ViewContracts.hlsli
    namespace: oxygen::vortex
    structs:
      - name: ViewFrameBindings
        doc: |-
          Top-level routing record of one view, referenced from the view
          constants. Lighting also carries the expected publication generation,
          so a stale descriptor cannot authorize it.
        layout: structured
        size: 64
        align: 16
        loader: { domain: srv_global }
        fields:
          - { name: draw_frame_slot, type: uint, slot: srv_global }
          - { name: lighting_frame_slot, type: uint, slot: srv_global }
          - { name: environment_frame_slot, type: uint, slot: srv_global }
          - { name: frame_exposure_slot, type: uint, slot: srv_global }
          - { name: scene_texture_frame_slot, type: uint, slot: srv_global }
          - { name: _pad1, type: uint }
          - { name: screen_hzb_frame_slot, type: uint, slot: srv_global }
          - { name: shadow_frame_slot, type: uint, slot: srv_global }
          - { name: virtual_shadow_frame_slot, type: uint, slot: srv_global }
          - { name: _pad0, type: uint }
          - { name: debug_frame_slot, type: uint, slot: srv_global }
          - { name: history_frame_slot, type: uint, slot: srv_global }
          - { name: ray_tracing_frame_slot, type: uint, slot: srv_global }
          - { name: exposure_status_uav, type: uint, slot: any }
          - name: lighting_view_generation
            type: uint2
            cpp: "std::array<std::uint32_t, 2>"
            doc: Expected lighting publication identity, distinct from descriptor indices.

      - name: ViewHistoryFrameBindings
        doc: |-
          A view's unjittered current projection and its previous view state;
          the current view and projection matrices live in the view constants.
          The renderer publishes history for every view with a resolved camera,
          so a missing record is an error, never "history equals current".
        layout: structured
        size: 384
        align: 16
        loader: { domain: srv_global }
        fields:
          - { name: current_stable_projection_matrix, type: float4x4 }
          - { name: previous_view_matrix, type: float4x4 }
          - { name: previous_projection_matrix, type: float4x4 }
          - { name: previous_stable_projection_matrix, type: float4x4 }
          - { name: previous_inverse_view_projection_matrix, type: float4x4 }
          - { name: current_pixel_jitter, type: float2 }
          - { name: previous_pixel_jitter, type: float2 }
          - { name: current_view_rect_min_and_size, type: float4 }
          - { name: previous_view_rect_min_and_size, type: float4 }
          - { name: validity_flags, type: uint }
          - { name: _pad0, type: uint }
          - { name: _pad1, type: uint }
          - { name: _pad2, type: uint }

  # --- Exposure (byte-address records) ---------------------------------------
  - id: exposure
    cpp: Oxygen/Vortex/Types/Generated.ExposureContracts.h
    hlsl: Vortex/Contracts/View/Generated.ExposureContracts.hlsli
    namespace: oxygen::vortex
    structs:
      - name: FrameExposureData
        doc: Immutable numerical-domain binding for one rendered frame.
        layout: structured
        size: 16
        align: 16
        loader: { domain: srv_global }
        fields:
          - { name: pre_exposure, type: float, default: "1.0F" }
          - { name: one_over_pre_exposure, type: float, default: "1.0F" }
          - { name: global_exposure_state_slot, type: uint, slot: srv_global }
          - { name: flags, type: uint }

      - name: HdrSuitabilityData
        doc: GPU qualification of reference products; this alone is not format admission.
        layout: bytes
        hlsl_prefix: HDR_SUITABILITY
        size: 48
        align: 16
        fields:
          - { name: candidate_pre_exposure, type: float, default: "1.0F" }
          - { name: maximum_scene_rgb, type: float }
          - { name: checked_products, type: uint }
          - { name: failure_flags, type: uint }
          - { name: first_failure_product, type: uint }
          - { name: rejected_samples, type: uint }
          - { name: metering_failures, type: uint }
          - { name: image_failures, type: uint }
          - { name: overflow_failures, type: uint }
          - { name: checked_samples, type: uint }
          - { name: expected_products, type: uint }
          - { name: reserved, type: uint }

      - name: ExposureStateData
        doc: Shared GPU exposure state; uint64 identities use low/high uint32 words.
        layout: bytes
        hlsl_prefix: EXPOSURE_STATE
        size: 80
        align: 16
        fields:
          - { name: displayed_scale, type: float, default: "1.0F" }
          - { name: target_scale, type: float, default: "1.0F" }
          - { name: latent_scale, type: float, default: "1.0F" }
          - { name: latent_target_scale, type: float, default: "1.0F" }
          - { name: raw_metered_luminance, type: float }
          - { name: raw_metered_ev, type: float }
          - { name: flags, type: uint }
          - { name: fallback_reason, type: uint, default: "1U" }
          - {
              name: settings_revision,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - {
              name: requested_generation,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - {
              name: applied_generation,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - {
              name: frame_sequence,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - { name: fp16_candidate_pre_exposure, type: float, default: "1.0F" }
          - { name: fp16_eligible_streak, type: uint }
          - {
              name: product_layout_revision,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }

      - name: ExposureCompletedStatus
        doc: Non-numerical asynchronous application/range status (low/high words).
        layout: bytes
        hlsl_prefix: EXPOSURE_COMPLETED
        size: 80
        align: 16
        fields:
          - {
              name: view_state_identity,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - {
              name: frame_sequence,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - {
              name: settings_revision,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - {
              name: requested_generation,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - {
              name: applied_generation,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - {
              name: product_layout_revision,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - { name: flags, type: uint }
          - { name: first_failure_product, type: uint }
          - { name: first_failure_kind, type: uint }
          - { name: fp16_eligible_streak, type: uint }
          - {
              name: candidate_state_generation,
              type: uint2,
              cpp: "std::array<std::uint32_t, 2>",
            }
          - { name: transition_rejection_reason, type: uint }
          - { name: reserved, type: uint }

      - name: HdrErrorBoundsData
        doc: "GPU-only affine error data: abs(observed-reference) <= r*reference+a."
        layout: bytes
        hlsl_prefix: HDR_ERROR_BOUNDS
        size: 16
        align: 16
        fields:
          - { name: rgb_relative, type: float }
          - { name: rgb_absolute, type: float }
          - { name: transmittance_relative, type: float }
          - { name: transmittance_absolute, type: float }

      - name: HdrCompositionInputData
        doc: GPU-only opaque SceneColor range before sky/AP/fog/translucency.
        layout: bytes
        hlsl_prefix: HDR_COMPOSITION_INPUT
        size: 16
        align: 16
        fields:
          - { name: maximum_pre_exposed_rgb, type: float }
          - {
              name: flags,
              type: uint,
              doc: "Recorded=1, nonfinite input=2, negative RGB=4.",
            }
          - { name: checked_pixels, type: uint }
          - { name: reserved, type: uint }

      - name: HdrOpaqueApErrorData
        doc: |-
          Retained store-error contribution to opaque I + C*T, before later
          stages. Excludes filtering/arithmetic/coverage and prospective
          candidate stores.
        layout: bytes
        hlsl_prefix: HDR_OPAQUE_AP_ERROR
        size: 16
        align: 16
        fields:
          - { name: rgb_relative, type: float }
          - { name: rgb_absolute, type: float, doc: "Scene-referred units." }
          - { name: valid, type: uint }
          - { name: reserved, type: uint }

      - name: HdrFilterGradientData
        doc: GPU-only reference gradient maxima for linear-clamp sampling.
        layout: bytes
        hlsl_prefix: HDR_FILTER_GRADIENT
        size: 32
        align: 16
        fields:
          - {
              name: rgb,
              type: float3,
              cpp: "std::array<float, 3>",
              doc: "Scene-referred maximum adjacent differences.",
            }
          - {
              name: flags,
              type: uint,
              doc: "Recorded=1, invalid input/interval=2.",
            }
          - { name: transmittance, type: float3, cpp: "std::array<float, 3>" }
          - { name: checked_texels, type: uint }

      - name: HdrSceneErrorData
        doc: |-
          Whole-scene affine bounds before the final resolve. RGB is scene
          referred; coverage is dimensionless. Candidate bounds include
          prospective upstream stores, but exclude the final store checked by
          scene admission.
        layout: bytes
        hlsl_prefix: HDR_SCENE_ERROR
        size: 48
        align: 16
        fields:
          - { name: current_rgb_relative, type: float }
          - { name: current_rgb_absolute, type: float }
          - { name: current_coverage_relative, type: float }
          - { name: current_coverage_absolute, type: float }
          - { name: candidate_rgb_relative, type: float }
          - { name: candidate_rgb_absolute, type: float }
          - { name: candidate_coverage_relative, type: float }
          - { name: candidate_coverage_absolute, type: float }
          - { name: candidate_pre_exposure, type: float, default: "1.0F" }
          - { name: checked_products, type: uint }
          - {
              name: flags,
              type: uint,
              doc: "Complete current=1, complete candidate=2.",
            }
          - { name: reserved, type: uint }

      - name: HdrConsumerInputData
        doc: Shader-observed nonnegative inputs before AP/fog attenuation, in scene units.
        layout: bytes
        hlsl_prefix: HDR_CONSUMER_INPUT
        size: 16
        align: 16
        fields:
          - { name: translucent_rgb_max, type: float }
          - { name: height_fog_rgb_max, type: float }
          - name: flags
            type: uint
            doc: |-
              Translucency/height=1/2; invalid inputs=4/8; sky/opaque
              AP/translucent AP consumers=16/32/64; invalid sky gain=128.
          - { name: sky_rgb_gain_max, type: float }

      - name: ExposureStatusStorage
        doc: The readback prefix stays non-numerical; the tail remains GPU-owned.
        layout: bytes
        hlsl_prefix: EXPOSURE_STATUS
        size: 384
        align: 16
        fields:
          - { name: completed, type: ExposureCompletedStatus }
          - {
              name: producer_errors,
              type: HdrErrorBoundsData,
              count: 3,
              doc: "Sky view, AP, fog.",
            }
          - { name: composition_input, type: HdrCompositionInputData }
          - { name: opaque_ap_error, type: HdrOpaqueApErrorData }
          - {
              name: filter_gradients,
              type: HdrFilterGradientData,
              count: 3,
              doc: "Sky, AP, fog.",
            }
          - { name: scene_error, type: HdrSceneErrorData }
          - name: candidate_errors
            type: HdrErrorBoundsData
            count: 3
            doc: |-
              Prospective stores at the selected candidate P, including
              retained error: sky, AP, fog.
          - { name: consumer_inputs, type: HdrConsumerInputData }
          - name: product_reference_rgb_max
            type: float3
            cpp: "std::array<float, 3>"
            doc: Scene-referred reference RGB maxima for sky, AP and fog, respectively.
          - { name: product_range_reserved, type: uint }

  # --- Draw -------------------------------------------------------------------
  - id: draw
    cpp: Oxygen/Vortex/Types/Generated.DrawContracts.h
    hlsl: Vortex/Contracts/Draw/Generated.DrawContracts.hlsli
    namespace: oxygen::vortex
    cpp_includes:
      - <Oxygen/Vortex/Types/BindlessSlots.h>
      - <Oxygen/Vortex/Types/PassMask.h>
    structs:
      - name: DrawFrameBindings
        doc: Bindless draw-system routing record of one view.
        layout: structured
        size: 64
        align: 16
        loader: { domain: srv_global }
        fields:
          - {
              name: draw_metadata_slot,
              type: uint,
              slot: materials,
              cpp: BindlessDrawMetadataSlot,
            }
          - {
              name: current_worlds_slot,
              type: uint,
              slot: srv_global,
              cpp: BindlessWorldsSlot,
            }
          - {
              name: previous_worlds_slot,
              type: uint,
              slot: srv_global,
              cpp: BindlessWorldsSlot,
            }
          - {
              name: normal_matrices_slot,
              type: uint,
              slot: srv_global,
              cpp: BindlessNormalsSlot,
            }
          - {
              name: material_shading_constants_slot,
              type: uint,
              slot: materials,
              cpp: BindlessMaterialShadingConstantsSlot,
            }
          - {
              name: procedural_grid_material_constants_slot,
              type: uint,
              slot: materials,
              cpp: BindlessProceduralGridMaterialConstantsSlot,
            }
          - {
              name: instance_data_slot,
              type: uint,
              slot: srv_global,
              cpp: BindlessInstanceDataSlot,
            }
          - {
              name: current_material_wpo_slot,
              type: uint,
              slot: srv_global,
              cpp: BindlessMaterialWpoPublicationsSlot,
            }
          - {
              name: previous_material_wpo_slot,
              type: uint,
              slot: srv_global,
              cpp: BindlessMaterialWpoPublicationsSlot,
            }
          - {
              name: current_motion_vector_status_slot,
              type: uint,
              slot: srv_global,
              cpp: BindlessMotionVectorStatusPublicationsSlot,
            }
          - {
              name: previous_motion_vector_status_slot,
              type: uint,
              slot: srv_global,
              cpp: BindlessMotionVectorStatusPublicationsSlot,
            }
          - {
              name: velocity_draw_metadata_slot,
              type: uint,
              slot: srv_global,
              cpp: BindlessVelocityDrawMetadataSlot,
            }
          - {
              name: cull_records_slot,
              type: uint,
              slot: materials,
              cpp: BindlessDrawCullRecordsSlot,
              doc: "One DrawCullRecord per draw, in draw-metadata order.",
            }
          - { name: _pad0, type: uint }
          - { name: _pad1, type: uint }
          - { name: _pad2, type: uint }

      - name: DrawMetadata
        doc: |-
          Per-draw metadata: geometry buffers, draw configuration and the
          transform, instance and material indirections of one draw.
          Populated on the CPU; shaders read it through
          DrawFrameBindings::draw_metadata_slot. 64 bytes, so a 16-byte aligned
          staging offset is always a multiple of the stride.
        layout: structured
        size: 64
        loader: { domain: materials, array: true }
        fields:
          - {
              name: vertex_buffer_index,
              type: uint,
              slot: srv_global,
              doc: "Vertex buffer of the mesh.",
            }
          - {
              name: index_buffer_index,
              type: uint,
              slot: srv_global,
              doc: "Index buffer of the mesh.",
            }
          - {
              name: first_index,
              type: uint,
              doc: "Start index within the mesh index buffer.",
            }
          - {
              name: base_vertex,
              type: int,
              doc: "Base vertex offset (can be negative).",
            }
          - {
              name: is_indexed,
              type: uint,
              doc: "0 = non-indexed, 1 = indexed.",
            }
          - {
              name: instance_count,
              type: uint,
              doc: "Number of instances (at least 1).",
            }
          - {
              name: index_count,
              type: uint,
              doc: "Number of indices of an indexed draw.",
            }
          - {
              name: vertex_count,
              type: uint,
              doc: "Number of vertices of a non-indexed draw.",
            }
          - {
              name: material_handle,
              type: uint,
              doc: "Stable MaterialRegistry handle (0 sentinel).",
            }
          - {
              name: transform_index,
              type: uint,
              doc: "Index into the world and normal transform arrays.",
            }
          - {
              name: instance_metadata_buffer_index,
              type: uint,
              doc: "Bindless index of the instance metadata buffer.",
            }
          - {
              name: instance_metadata_offset,
              type: uint,
              doc: "Offset into the instance metadata buffer.",
            }
          - { name: flags, type: uint, cpp: PassMask, doc: "Pass mask." }
          - {
              name: transform_generation,
              type: uint,
              doc: "Transform-handle generation, for stable primitive identity.",
            }
          - {
              name: submesh_index,
              type: uint,
              doc: "Stable submesh id within the geometry asset.",
            }
          - { name: primitive_flags, type: uint, doc: "DrawPrimitiveFlagBits." }

      - name: DrawCullRecord
        doc: |-
          Per-draw culling record, one per draw in draw-metadata order. A
          single draw stores its mesh view's local box; the cull kernels
          transform it by the draw's world matrix into an oriented box. An
          instanced batch stores the world AABB union of its instances and
          sets kWorldSpaceBox. History slots are per culling view, so they live
          in each view's own slot buffer.
        layout: structured
        size: 32
        loader: { domain: materials, array: true }
        fields:
          - { name: box_center, type: float3 }
          - { name: _pad0, type: uint }
          - { name: box_extent, type: float3 }
          - { name: flags, type: uint, doc: "DrawCullFlagBits." }

  # --- Scene textures ---------------------------------------------------------
  - id: scene
    cpp: Oxygen/Vortex/SceneRenderer/Generated.SceneTextureBindings.h
    hlsl: Vortex/Contracts/Scene/Generated.SceneTextureBindings.hlsli
    namespace: oxygen::vortex
    structs:
      - name: SceneTextureBindings
        hlsl_name: SceneTextureBindingData
        doc: |-
          A view's published scene textures. The record reserves the whole
          logical GBuffer family; slots a view does not produce stay invalid.
        layout: structured
        size: 64
        loader: { domain: srv_global }
        fields:
          - { name: scene_color_srv, type: uint, slot: textures }
          - { name: scene_depth_srv, type: uint, slot: textures }
          - { name: partial_depth_srv, type: uint, slot: textures }
          - { name: velocity_srv, type: uint, slot: textures }
          - { name: stencil_srv, type: uint, slot: textures }
          - { name: custom_depth_srv, type: uint, slot: textures }
          - { name: custom_stencil_srv, type: uint, slot: textures }
          - name: gbuffer_srvs
            type: uint
            count: 6
            slot: textures
            default: "kInvalidShaderVisibleIndex, kInvalidShaderVisibleIndex, kInvalidShaderVisibleIndex, kInvalidShaderVisibleIndex, kInvalidShaderVisibleIndex, kInvalidShaderVisibleIndex"
            doc: Indexed by GBufferIndex.
          - { name: scene_color_uav, type: uint, slot: any }
          - { name: velocity_uav, type: uint, slot: any }
          - {
              name: valid_flags,
              type: uint,
              doc: "SceneTextureSetupMode flags.",
            }

  # --- Shadows ----------------------------------------------------------------
  - id: shadows
    cpp: Oxygen/Vortex/Shadows/Types/Generated.ShadowContracts.h
    hlsl: Vortex/Contracts/Shadows/Generated.ShadowContracts.hlsli
    namespace: oxygen::vortex
    cpp_includes:
      - <Oxygen/Vortex/Types/LightingIndices.h>
    constants:
      - {
          cpp: kShadowProjectionNone,
          hlsl: SHADOW_PROJECTION_NONE,
          type: uint,
          value: 0,
        }
      - {
          cpp: kShadowProjectionCascaded2D,
          hlsl: SHADOW_PROJECTION_CASCADED_2D,
          type: uint,
          value: 1,
        }
      - {
          cpp: kShadowProjectionLocalCube,
          hlsl: SHADOW_PROJECTION_LOCAL_CUBE,
          type: uint,
          value: 2,
        }
      - {
          cpp: kShadowProjectionLocalProjected2D,
          hlsl: SHADOW_PROJECTION_LOCAL_PROJECTED_2D,
          type: uint,
          value: 3,
        }
      - {
          cpp: kShadowCoverageNoRequest,
          hlsl: SHADOW_COVERAGE_NO_REQUEST,
          type: uint,
          value: 0,
        }
      - {
          cpp: kShadowCoverageNoInfluence,
          hlsl: SHADOW_COVERAGE_NO_INFLUENCE,
          type: uint,
          value: 1,
        }
      - {
          cpp: kShadowCoverageComplete,
          hlsl: SHADOW_COVERAGE_COMPLETE,
          type: uint,
          value: 2,
        }
      - {
          cpp: kShadowCoverageOutsideAuthored,
          hlsl: SHADOW_COVERAGE_OUTSIDE_AUTHORED,
          type: uint,
          value: 3,
        }
      - {
          cpp: kShadowCoverageQualityOmitted,
          hlsl: SHADOW_COVERAGE_QUALITY_OMITTED,
          type: uint,
          value: 4,
        }
      - {
          cpp: kShadowSamplingReversedZPcf,
          hlsl: SHADOW_SAMPLING_REVERSED_Z_PCF,
          type: uint,
          value: 1,
        }
      - {
          cpp: kCubeLocalShadowFaceCount,
          hlsl: CUBE_LOCAL_SHADOW_FACE_COUNT,
          type: uint,
          value: 6,
        }
    structs:
      - name: ShadowCascadeBinding
        hlsl_name: VortexShadowCascadeBinding
        doc: One directional projection, with explicit surface identity and sampling units.
        layout: structured
        size: 128
        align: 16
        loader: { domain: srv_global, array: true }
        fields:
          - { name: light_view_projection, type: float4x4 }
          - { name: split_near, type: float }
          - { name: split_far, type: float }
