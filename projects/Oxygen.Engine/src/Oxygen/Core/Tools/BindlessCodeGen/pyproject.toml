[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bindless-codegen"
version = "0.1.0"
description = "Bindless binding slots code generator for Oxygen Engine"
authors = [ {name = "Oxygen Dev"} ]
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bindless_codegen = "bindless_codegen.cli:main"
