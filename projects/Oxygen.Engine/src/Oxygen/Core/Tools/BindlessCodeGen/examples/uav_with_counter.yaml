# The counter is managed explicitly by the application, not a native D3D12 hidden UAV counter.
meta:
  version: 2.0.0
  description: Particle UAVs plus a separately addressable raw buffer for an explicit counter.
defaults:
  invalid_index: 4294967295
abi:
  index_spaces:
    - id: srv_uav_cbv
  domains:
    - id: particles_uav
      name: ParticlesUAV
      index_space: srv_uav_cbv
      shader_index_base: 0
      capacity: 64
      shader_access_class: buffer_uav
      view_types:
        - StructuredBuffer_UAV
    - id: counter
      name: Counter
      index_space: srv_uav_cbv
      shader_index_base: 64
      capacity: 1
      shader_access_class: buffer_uav
      view_types:
        - RawBuffer_UAV
backends:
  d3d12:
    strategy:
      heaps:
        - id: CBV_SRV_UAV:gpu
          type: CBV_SRV_UAV
          shader_visible: true
          capacity: 65
          base_index: 0
          allow_growth: false
      tables:
        - id: ParticlesUAVTable
          descriptor_kind: UAV
          heap: CBV_SRV_UAV:gpu
          shader_register: u0
          register_space: space0
          descriptor_count: 65
      domain_realizations:
        - domain: particles_uav
          table: ParticlesUAVTable
          heap_local_base: 0
        - domain: counter
          table: ParticlesUAVTable
          heap_local_base: 64
    root_signature:
      - type: descriptor_table
        id: ParticlesUAVTable
        table: ParticlesUAVTable
        index: 0
        visibility: ALL
  vulkan:
    strategy:
      descriptor_sets:
        - id: resources
          set: 0
      bindings:
        - id: particles_uav_binding
          set: resources
          binding: 0
          descriptor_type: STORAGE_BUFFER
          descriptor_count: 64
        - id: counter_binding
          set: resources
          binding: 1
          descriptor_type: STORAGE_BUFFER
          descriptor_count: 1
      domain_realizations:
        - domain: particles_uav
          binding: particles_uav_binding
          array_element_base: 0
        - domain: counter
          binding: counter_binding
          array_element_base: 0
    pipeline_layout:
      - type: descriptor_set
        id: Resources
        set_ref: resources
