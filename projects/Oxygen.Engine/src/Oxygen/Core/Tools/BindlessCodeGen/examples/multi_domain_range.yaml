# D3D12 heap-local ranges are disjoint; each Vulkan binding starts at array element zero.
meta:
  version: 2.0.0
  description: Materials and textures share a D3D12 SRV table; Vulkan uses typed bindings.
defaults:
  invalid_index: 4294967295
abi:
  index_spaces:
    - id: srv_uav_cbv
  domains:
    - id: materials
      name: Materials
      index_space: srv_uav_cbv
      shader_index_base: 0
      capacity: 1024
      shader_access_class: buffer_srv
      view_types:
        - StructuredBuffer_SRV
    - id: textures
      name: Textures
      index_space: srv_uav_cbv
      shader_index_base: 1024
      capacity: 4096
      shader_access_class: texture_srv
      view_types:
        - Texture_SRV
backends:
  d3d12:
    strategy:
      heaps:
        - id: CBV_SRV_UAV:gpu
          type: CBV_SRV_UAV
          shader_visible: true
          capacity: 5120
          base_index: 0
          allow_growth: false
      tables:
        - id: MaterialsTable
          descriptor_kind: SRV
          heap: CBV_SRV_UAV:gpu
          shader_register: t1
          register_space: space0
          unbounded: true
      domain_realizations:
        - domain: materials
          table: MaterialsTable
          heap_local_base: 0
        - domain: textures
          table: MaterialsTable
          heap_local_base: 1024
    root_signature:
      - type: descriptor_table
        id: MaterialsTable
        table: MaterialsTable
        index: 0
        visibility: ALL
  vulkan:
    strategy:
      descriptor_sets:
        - id: resources
          set: 0
      bindings:
        - id: materials_binding
          set: resources
          binding: 0
          descriptor_type: STORAGE_BUFFER
          descriptor_count: 1024
        - id: textures_binding
          set: resources
          binding: 1
          descriptor_type: SAMPLED_IMAGE
          descriptor_count: 4096
      domain_realizations:
        - domain: materials
          binding: materials_binding
          array_element_base: 0
        - domain: textures
          binding: textures_binding
          array_element_base: 0
    pipeline_layout:
      - type: descriptor_set
        id: Resources
        set_ref: resources
