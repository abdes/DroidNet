# The ABI capacity remains finite even when the backend table allows variable counts.
meta:
  version: 2.0.0
  description: A texture SRV domain realized by an unbounded D3D12 table.
defaults:
  invalid_index: 4294967295
abi:
  index_spaces:
    - id: srv_uav_cbv
  domains:
    - id: textures
      name: Textures
      index_space: srv_uav_cbv
      shader_index_base: 0
      capacity: 1024
      shader_access_class: texture_srv
      view_types:
        - Texture_SRV
backends:
  d3d12:
    strategy:
      heaps:
        - id: CBV_SRV_UAV:gpu
          type: CBV_SRV_UAV
          shader_visible: true
          capacity: 1024
          base_index: 0
          allow_growth: false
      tables:
        - id: TexturesTable
          descriptor_kind: SRV
          heap: CBV_SRV_UAV:gpu
          shader_register: t0
          register_space: space0
          unbounded: true
      domain_realizations:
        - domain: textures
          table: TexturesTable
          heap_local_base: 0
    root_signature:
      - type: descriptor_table
        id: TexturesTable
        table: TexturesTable
        index: 0
        visibility: ALL
  vulkan:
    strategy:
      descriptor_sets:
        - id: resources
          set: 0
      bindings:
        - id: textures_binding
          set: resources
          binding: 0
          descriptor_type: SAMPLED_IMAGE
          descriptor_count: 1024
          variable_count: true
          update_after_bind: true
      domain_realizations:
        - domain: textures
          binding: textures_binding
          array_element_base: 0
    pipeline_layout:
      - type: descriptor_set
        id: Resources
        set_ref: resources
