# V2 uses a CBV descriptor table; there is no cbv_array_size root-parameter field.
meta:
  version: 2.0.0
  description: A fixed array of 8 constant-buffer descriptors.
defaults:
  invalid_index: 4294967295
abi:
  index_spaces:
    - id: srv_uav_cbv
  domains:
    - id: cbv_dom
      name: CBVDomain
      index_space: srv_uav_cbv
      shader_index_base: 0
      capacity: 8
      shader_access_class: constant_buffer
      view_types:
        - ConstantBuffer
backends:
  d3d12:
    strategy:
      heaps:
        - id: CBV_SRV_UAV:gpu
          type: CBV_SRV_UAV
          shader_visible: true
          capacity: 8
          base_index: 0
          allow_growth: false
      tables:
        - id: CBVDomainTable
          descriptor_kind: CBV
          heap: CBV_SRV_UAV:gpu
          shader_register: b1
          register_space: space0
          descriptor_count: 8
      domain_realizations:
        - domain: cbv_dom
          table: CBVDomainTable
          heap_local_base: 0
    root_signature:
      - type: descriptor_table
        id: CBVDomainTable
        table: CBVDomainTable
        index: 0
        visibility: ALL
  vulkan:
    strategy:
      descriptor_sets:
        - id: resources
          set: 0
      bindings:
        - id: cbv_dom_binding
          set: resources
          binding: 0
          descriptor_type: UNIFORM_BUFFER
          descriptor_count: 8
      domain_realizations:
        - domain: cbv_dom
          binding: cbv_dom_binding
          array_element_base: 0
    pipeline_layout:
      - type: descriptor_set
        id: Resources
        set_ref: resources
