  <g font-size="11" fill="#e0e0e0">
    <rect x="1220" y="40" width="212" height="760" rx="6" fill="#161616" stroke="#4a4a4a"/>
    <text x="1230" y="62" font-weight="600" fill="#ffffff">What the mockup shows</text>
    <text x="1230" y="84">1. Files: extended selection (ME-13),</text>
    <text x="1240" y="99">Ctrl+A selects all. Car.fbx alone</text>
    <text x="1240" y="114">is selected. Glyphs: analysis</text>
    <text x="1240" y="129">problems, name taken.</text>
    <text x="1230" y="151">2. Facts: an informational InfoBar;</text>
    <text x="1240" y="166">format and version from the</text>
    <text x="1240" y="181">analysis (E11).</text>
    <text x="1230" y="203">3. Settings: the Model Editor's panel</text>
    <text x="1240" y="218">(ME-11); rows that do not apply</text>
    <text x="1240" y="233">are absent; defaults in secondary</text>
    <text x="1240" y="248">text, a set value has the override</text>
    <text x="1240" y="263">bar and a reset (Glass).</text>
    <text x="1230" y="285">Settings use the inspector's own</text>
    <text x="1240" y="300">controls: PropertiesExpander groups,</text>
    <text x="1240" y="315">PropertyCard rows (override bar,</text>
    <text x="1240" y="330">reset, responsive layout), Inspector-</text>
    <text x="1240" y="345">NumberField (units, prefixes,</text>
    <text x="1240" y="360">validation, label scrubbing),</text>
    <text x="1240" y="375">InspectorToggleField, and Asset-</text>
    <text x="1240" y="390">PickerButton (Pickers), never the</text>
    <text x="1240" y="405">Scene Inspector project.</text>
    <text x="1230" y="427">4. Node continuity and the selection</text>
    <text x="1240" y="442">groups need a previous import.</text>
    <text x="1230" y="464">5. Before import: InfoBars of the</text>
    <text x="1240" y="479">diagnostics the import will report.</text>
    <text x="1230" y="501">6. List toolbar, icon-only: Add,</text>
    <text x="1240" y="516">Remove | Move up, Move down;</text>
    <text x="1240" y="531">drag reorders. Move up is off:</text>
    <text x="1240" y="546">the first row is selected.</text>
    <text x="1230" y="568">7. Splitters: list | settings (min</text>
    <text x="1240" y="583">420 px) | Before import, 70:30.</text>
    <text x="1230" y="605">8. Import is a split button: its</text>
    <text x="1240" y="620">chevron opens the Import run</text>
    <text x="1240" y="635">flyout (model-import-dialog-run).</text>
    <text x="1230" y="657">9. Sessions: an import manifest,</text>
    <text x="1240" y="672">for the editor and the CLI (ME-15).</text>
    <text x="1230" y="694">Layers (WinUI 3 dark tokens):</text>
    <text x="1240" y="709">smoke 30 %, dialog base #202020,</text>
    <text x="1240" y="724">content on LayerFillColorAlt, the</text>
    <text x="1240" y="739">button bar on the base; cards,</text>
    <text x="1240" y="754">inputs and InfoBars above it.</text>
  </g>
</svg>
