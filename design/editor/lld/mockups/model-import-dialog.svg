  <text x="587" y="468" fill="#ffffff" fill-opacity="0.773">From the file (Z up)</text>
  <text x="1116" y="467" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="10" fill="#ffffff" fill-opacity="0.77">&#xE70D;</text>
  <rect x="406" y="496" width="780" height="52" rx="8" fill="#ffffff" fill-opacity="0.031" stroke="#000000" stroke-opacity="0.10"/>
  <rect x="406" y="496" width="780" height="52" rx="8" fill="#ffffff" fill-opacity="0.051"/>
  <text x="420" y="529" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="18" fill="#ffffff">&#xF158;</text>
  <text x="452" y="519" font-weight="600" fill="#ffffff">Geometry</text>
  <text x="452" y="536" font-size="12" fill="#ffffff" fill-opacity="0.773">Normals, tangents and node pivots of the meshes.</text>
  <text x="1162" y="527" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.77">&#xE70D;</text>
  <rect x="406" y="556" width="780" height="52" rx="8" fill="#ffffff" fill-opacity="0.031" stroke="#000000" stroke-opacity="0.10"/>
  <rect x="406" y="556" width="780" height="52" rx="8" fill="#ffffff" fill-opacity="0.051"/>
