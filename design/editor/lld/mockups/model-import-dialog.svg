<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14">
  <title>Import model dialog, one file selected (dark theme)</title>
  <desc>The Import model dialog with three files listed and Car.fbx selected alone. Name and content folder rows, then an informational InfoBar with the file's facts. Below, three columns separated by splitters: the file list with its icon-only toolbar; the import settings panel, drawn with the inspector's controls (PropertiesExpander groups of PropertyCard rows: Units and axes expanded with the file's units, Units and Up axis; Geometry and Hierarchy collapsed; Materials expanded: each source material is a PropertyCard with the inspector's material SplitButton, Glass set to the project's Glass material with its override bar and reset); and Before import as InfoBars. The button bar holds Open session and Save session on the left, the Import 3 split button (Import disabled while the name of Crates.gltf is taken; its chevron opens the Import run settings) and Cancel. Colours are WinUI 3 dark-theme tokens.</desc>
