  <line x1="174" y1="842" x2="394" y2="842" stroke="#ffffff" stroke-opacity="0.082"/>
  <text x="189" y="864" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#ffffff">&#xE710;<title>Add files… (Ctrl+O)</title></text>
