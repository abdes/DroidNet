  <text x="452" y="301" font-weight="600" fill="#ffffff">Units and axes</text>
  <text x="452" y="318" font-size="12" fill="#ffffff" fill-opacity="0.773">How the file's size and orientation are read.</text>
  <text x="1162" y="309" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.77">&#xE70E;</text>
  <text x="426" y="360" fill="#ffffff">Result</text>
  <text x="576" y="358" font-size="12" fill="#ffffff" fill-opacity="0.773">Real size kept: converted from centimetres</text>
  <text x="576" y="374" font-size="12" fill="#ffffff" fill-opacity="0.773">to Oxygen's metres (1 file unit = 0.01 m).</text>
  <text x="576" y="390" font-size="12" fill="#ffffff" fill-opacity="0.773">Already Z up, as Oxygen is.</text>
  <text x="426" y="430" fill="#ffffff">Units</text>
