  <text x="452" y="579" font-weight="600" fill="#ffffff">Hierarchy</text>
  <text x="452" y="596" font-size="12" fill="#ffffff" fill-opacity="0.773">Which of the file's nodes are kept.</text>
  <text x="1162" y="587" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.77">&#xE70D;</text>
  <rect x="406" y="616" width="780" height="52" rx="8" fill="#ffffff" fill-opacity="0.031" stroke="#000000" stroke-opacity="0.10"/>
  <rect x="406" y="616" width="780" height="52" rx="8" fill="#ffffff" fill-opacity="0.051"/>
  <text x="420" y="649" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="18" fill="#ffffff">&#xE91B;</text>
  <text x="452" y="639" font-weight="600" fill="#ffffff">Textures</text>
  <text x="452" y="656" font-size="12" fill="#ffffff" fill-opacity="0.773">Size, compression and normal map convention.</text>
  <text x="1162" y="647" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.77">&#xE70D;</text>
  <rect x="406" y="676" width="780" height="52" rx="8" fill="#ffffff" fill-opacity="0.031" stroke="#000000" stroke-opacity="0.10"/>
  <rect x="406" y="676" width="780" height="52" rx="8" fill="#ffffff" fill-opacity="0.051"/>
  <text x="420" y="709" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="18" fill="#ffffff">&#xEA80;</text>
  <text x="452" y="699" font-weight="600" fill="#ffffff">Lights and cameras</text>
  <text x="452" y="716" font-size="12" fill="#ffffff" fill-opacity="0.773">What the file's lights and cameras bring in.</text>
  <text x="1162" y="707" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.77">&#xE70D;</text>
  <rect x="406" y="736" width="780" height="178" rx="8" fill="#ffffff" fill-opacity="0.031" stroke="#000000" stroke-opacity="0.10"/>
