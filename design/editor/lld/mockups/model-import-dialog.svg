  <text x="587" y="430" fill="#ffffff" fill-opacity="0.773">Metres</text>
  <text x="1116" y="429" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="10" fill="#ffffff" fill-opacity="0.77">&#xE70D;</text>
  <text x="426" y="468" fill="#ffffff">Up axis</text>
