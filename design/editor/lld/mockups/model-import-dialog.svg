  <text x="442" y="231" font-size="13" font-weight="600" fill="#ffffff">3 warnings</text>
  <text x="513" y="231" font-size="13" fill="#ffffff">FBX 7.4 · centimetres, Z up, right-handed · 14 nodes · 9 meshes · 6 materials</text>
  <rect x="1058" y="210" width="120" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="1118.0" y="231" text-anchor="middle" fill="#ffffff">Before import<title>What the import will leave out or cannot read</title></text>
