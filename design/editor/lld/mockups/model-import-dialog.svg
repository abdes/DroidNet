  <text x="236.0" y="929" text-anchor="middle" fill="#ffffff">Open session…</text>
  <rect x="308" y="908" width="124" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
