<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="13">
  <title>Import model dialog (dark theme)</title>
  <desc>The Import model dialog opened from the Content Explorer's Import, Source model command with three files picked. Car.fbx is selected and carries a warning glyph. Its name and content folder rows come first, then one line of facts from the source analysis: FBX 7.4, centimetres, Z up, right-handed, and the counts. Below, the reusable import settings panel: Units and axes with the detected file units and the up axis from the file; Geometry with normals, smoothing angle, tangents, keep node pivots and generate LODs; Hierarchy collapsed; Materials with one row per source material, Glass pointed at the project's Glass.omat; Textures and Lights and cameras collapsed. There is no Source group, since an FBX file has one scene. On the right, what the analysis found before import: a dropped animation, a missing texture and the unit conversion. At the bottom: apply these settings to all files, open in the Model Editor, Import and Cancel.</desc>

  <!-- Workspace behind, dimmed -->
  <rect width="1440" height="900" fill="#1c1c1c"/>
  <rect x="0" y="0" width="1440" height="44" fill="#1f1f1f"/>
  <rect x="0" y="560" width="930" height="340" fill="#202020"/>
  <rect x="934" y="44" width="506" height="856" fill="#202020"/>
  <rect width="1440" height="900" fill="#000000" opacity="0.55"/>

  <!-- Dialog -->
  <rect x="150" y="40" width="1060" height="820" rx="8" fill="#2b2b2b" stroke="#3f3f3f"/>
  <text x="178" y="80" font-size="20" font-weight="600" fill="#ffffff">Import model</text>
  <text x="178" y="104" fill="#9e9e9e">3 files · each is analysed before it is imported, without loading its buffers</text>

  <!-- File list -->
  <rect x="170" y="124" width="220" height="626" rx="6" fill="#232323" stroke="#3a3a3a"/>
  <rect x="176" y="132" width="208" height="44" rx="4" fill="#2f4a5c"/>
  <rect x="176" y="142" width="3" height="24" rx="1.5" fill="#4cc2ff"/>
  <text x="188" y="160" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="16" fill="#e0e0e0">&#xF158;</text>
  <text x="214" y="152" fill="#ffffff">Car.fbx</text>
  <text x="214" y="168" font-size="11" fill="#c5c5c5">Content/Vehicles</text>
  <text x="366" y="160" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="13" fill="#fce100">&#xE7BA;<title>2 problems found by the analysis</title></text>
  <text x="188" y="208" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="16" fill="#9a9a9a">&#xF158;</text>
  <text x="214" y="200" fill="#c5c5c5">Truck.glb</text>
  <text x="214" y="216" font-size="11" fill="#9a9a9a">Content/Vehicles</text>
  <text x="188" y="256" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="16" fill="#9a9a9a">&#xF158;</text>
  <text x="214" y="248" fill="#c5c5c5">Crates.gltf</text>
  <text x="214" y="264" font-size="11" fill="#9a9a9a">Content/Props</text>

  <!-- Name and folder -->
  <g font-size="12">
    <text x="414" y="146" fill="#c5c5c5">Name</text>
    <rect x="530" y="128" width="300" height="28" rx="4" fill="#1f1f1f" stroke="#454545"/>
    <text x="540" y="147" fill="#ffffff">Car</text>
    <text x="414" y="184" fill="#c5c5c5">Content folder</text>
    <rect x="530" y="166" width="300" height="28" rx="4" fill="#1f1f1f" stroke="#454545"/>
    <text x="540" y="185" fill="#ffffff">Content/Vehicles</text>
    <rect x="840" y="166" width="80" height="28" rx="4" fill="#3a3a3a"/>
    <text x="856" y="185" fill="#ffffff">Browse…</text>
  </g>

  <!-- Facts line -->
  <rect x="410" y="206" width="780" height="30" rx="4" fill="#232323" stroke="#3a3a3a"/>
  <text x="422" y="226" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="13" fill="#78c9e8">&#xE946;</text>
  <text x="444" y="226" font-size="12" fill="#e0e0e0">FBX 7.4 · centimetres, Z up, right-handed · 1 scene · 14 nodes · 9 meshes · 6 materials · 11 textures</text>

  <!-- Import settings panel (the reusable control) -->
  <rect x="410" y="246" width="460" height="504" rx="4" fill="#252525"/>
  <text x="422" y="270" font-weight="600" fill="#ffffff">Import settings</text>
  <g font-size="12">
    <!-- Units and axes -->
    <text x="422" y="298" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="9" fill="#c5c5c5">&#xE70D;</text>
    <text x="438" y="299" font-weight="600" fill="#ffffff">Units and axes</text>
    <text x="438" y="323" fill="#9e9e9e">File</text>
    <text x="582" y="323" fill="#c5c5c5">centimetres · Z up · right-handed (3ds Max)</text>
    <text x="438" y="349" fill="#9e9e9e">Units</text>
    <rect x="582" y="333" width="210" height="22" rx="4" fill="#2b2b2b" stroke="#454545"/><text x="590" y="349" fill="#9e9e9e">Convert to metres</text>
    <text x="776" y="348" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="9" fill="#c5c5c5">&#xE70D;</text>
    <text x="438" y="375" fill="#9e9e9e">Up axis</text>
    <rect x="582" y="359" width="210" height="22" rx="4" fill="#2b2b2b" stroke="#454545"/><text x="590" y="375" fill="#9e9e9e">From the file (Z up)</text>
    <text x="776" y="374" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="9" fill="#c5c5c5">&#xE70D;</text>

    <!-- Geometry -->
    <text x="422" y="406" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="9" fill="#c5c5c5">&#xE70D;</text>
    <text x="438" y="407" font-weight="600" fill="#ffffff">Geometry</text>
    <text x="438" y="431" fill="#9e9e9e">Normals</text>
    <rect x="582" y="415" width="210" height="22" rx="4" fill="#2b2b2b" stroke="#454545"/><text x="590" y="431" fill="#9e9e9e">From the file, generate missing</text>
    <text x="438" y="457" fill="#9e9e9e">Smoothing angle</text>
    <rect x="582" y="441" width="80" height="22" rx="4" fill="#2b2b2b" stroke="#454545"/><text x="590" y="457" fill="#9e9e9e">60°</text>
    <text x="438" y="483" fill="#9e9e9e">Tangents</text>
    <rect x="582" y="467" width="210" height="22" rx="4" fill="#2b2b2b" stroke="#454545"/><text x="590" y="483" fill="#9e9e9e">From the file, generate missing</text>
    <text x="438" y="509" fill="#9e9e9e">Keep node pivots</text>
    <rect x="582" y="497" width="38" height="18" rx="9" fill="#4cc2ff"/><circle cx="610" cy="506" r="5" fill="#000000"/>
    <text x="438" y="535" fill="#9e9e9e">Generate LODs</text>
    <rect x="582" y="523" width="38" height="18" rx="9" fill="none" stroke="#9e9e9e"/><circle cx="592" cy="532" r="5" fill="#9e9e9e"/>

    <!-- Hierarchy (collapsed) -->
    <text x="422" y="566" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="9" fill="#c5c5c5">&#xE76C;</text>
    <text x="438" y="567" font-weight="600" fill="#ffffff">Hierarchy</text>
    <text x="582" y="567" fill="#9e9e9e">Keep empty nodes</text>

    <!-- Materials -->
    <text x="422" y="594" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="9" fill="#c5c5c5">&#xE70D;</text>
    <text x="438" y="595" font-weight="600" fill="#ffffff">Materials</text>
    <text x="582" y="595" fill="#78c9e8">Use project materials with the same name</text>
    <text x="438" y="619" fill="#c5c5c5">Paint</text>
    <rect x="582" y="603" width="210" height="22" rx="4" fill="#2b2b2b" stroke="#454545"/><text x="590" y="619" fill="#9e9e9e">Imported</text>
    <rect x="412" y="629" width="3" height="24" fill="#4cc2ff"/>
    <text x="438" y="645" fill="#c5c5c5">Glass</text>
    <rect x="582" y="629" width="210" height="22" rx="4" fill="#2b2b2b" stroke="#454545"/><text x="590" y="645" fill="#ffffff">Glass.omat</text>
    <text x="802" y="645" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="12" fill="#c5c5c5">&#xE777;<title>Reset: import the file's Glass material</title></text>
    <text x="438" y="671" fill="#c5c5c5">Chrome</text>
    <rect x="582" y="655" width="210" height="22" rx="4" fill="#2b2b2b" stroke="#454545"/><text x="590" y="671" fill="#9e9e9e">Imported</text>
    <text x="438" y="695" fill="#9a9a9a">3 more</text>

    <!-- Textures, Lights and cameras (collapsed) -->
    <text x="422" y="718" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="9" fill="#c5c5c5">&#xE76C;</text>
    <text x="438" y="719" font-weight="600" fill="#ffffff">Textures</text>
    <text x="582" y="719" fill="#9e9e9e">Source size · Default quality</text>
    <text x="422" y="740" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="9" fill="#c5c5c5">&#xE76C;</text>
    <text x="438" y="741" font-weight="600" fill="#ffffff">Lights and cameras</text>
    <text x="582" y="741" fill="#9e9e9e">Imported · intensity × 1</text>
  </g>

  <!-- Before import -->
  <rect x="884" y="246" width="306" height="504" rx="4" fill="#252525"/>
  <text x="898" y="270" font-weight="600" fill="#ffffff">Before import</text>
  <g font-size="12">
    <text x="898" y="300" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="12" fill="#fce100">&#xE7BA;</text>
    <text x="918" y="300" fill="#e0e0e0">Animation "Drive" is not imported:</text>
    <text x="918" y="316" fill="#e0e0e0">Oxygen imports no animation.</text>
    <text x="918" y="332" font-size="11" fill="#9a9a9a">import.source_feature_dropped</text>
    <text x="898" y="364" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="12" fill="#fce100">&#xE7BA;</text>
    <text x="918" y="364" fill="#e0e0e0">Texture "Paint_N.png" is not found;</text>
    <text x="918" y="380" fill="#e0e0e0">Paint renders with the error texture.</text>
    <text x="918" y="396" font-size="11" fill="#9a9a9a">material Paint · node Body</text>
    <text x="898" y="428" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="12" fill="#78c9e8">&#xE946;</text>
    <text x="918" y="428" fill="#e0e0e0">The file is in centimetres:</text>
    <text x="918" y="444" fill="#e0e0e0">Convert to metres scales it by 0.01.</text>
  </g>

  <!-- Footer -->
  <line x1="150" y1="770" x2="1210" y2="770" stroke="#3a3a3a"/>
  <rect x="172" y="790" width="18" height="18" rx="3" fill="none" stroke="#9e9e9e"/>
  <text x="200" y="804" fill="#e0e0e0">Apply these settings to all files</text>
  <rect x="440" y="790" width="18" height="18" rx="3" fill="#4cc2ff"/>
  <text x="443" y="804" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="12" fill="#000000">&#xE73E;</text>
  <text x="468" y="804" fill="#e0e0e0">Open in the Model Editor</text>
  <rect x="972" y="784" width="110" height="32" rx="4" fill="#4cc2ff"/>
  <text x="1002" y="805" fill="#000000">Import 3</text>
  <rect x="1092" y="784" width="100" height="32" rx="4" fill="#3a3a3a"/>
  <text x="1120" y="805" fill="#ffffff">Cancel</text>

  <!-- Annotations -->
  <g font-size="11" fill="#e0e0e0">
    <rect x="1220" y="40" width="212" height="560" rx="6" fill="#161616" stroke="#4a4a4a"/>
    <text x="1230" y="62" font-weight="600" fill="#ffffff">What the mockup shows</text>
    <text x="1230" y="84">1. Files: one row per picked file,</text>
    <text x="1240" y="99">each with its own name, folder</text>
    <text x="1240" y="114">and settings; the glyph marks</text>
    <text x="1240" y="129">problems found by the analysis.</text>
    <text x="1230" y="151">2. Facts: one line from the</text>
    <text x="1240" y="166">analysis (format, detected unit</text>
    <text x="1240" y="181">and axes, counts).</text>
    <text x="1230" y="203">3. Settings: the Model Editor's</text>
    <text x="1240" y="218">panel (ME-11). Rows that do not</text>
    <text x="1240" y="233">apply are absent: no Source for</text>
    <text x="1240" y="248">one scene, Up axis only for FBX.</text>
    <text x="1240" y="263">Defaults show in secondary text;</text>
    <text x="1240" y="278">a set value has the override bar.</text>
    <text x="1230" y="300">4. Node continuity and the</text>
    <text x="1240" y="315">selection groups are absent:</text>
    <text x="1240" y="330">they need a previous import.</text>
    <text x="1230" y="352">5. Before import: the diagnostics</text>
    <text x="1240" y="367">the import will report, known now.</text>
    <text x="1230" y="389">6. Apply to all copies the shown</text>
    <text x="1240" y="404">file's settings except its scene</text>
    <text x="1240" y="419">and material rows.</text>
    <text x="1230" y="441">7. A model of the same name in the</text>
    <text x="1240" y="456">folder adds today's replace review</text>
    <text x="1240" y="471">under the folder row.</text>
    <text x="1230" y="493">8. No 3D preview: the Model Editor</text>
    <text x="1240" y="508">opens after the import (ME-12).</text>
  </g>
</svg>
