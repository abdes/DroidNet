<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14">
  <title>Import model dialog, one file selected (dark theme)</title>
  <desc>The Import model dialog with three files listed and Car.fbx selected alone. Name and content folder rows, then an informational InfoBar with the file's facts. Below, two columns separated by a splitter: the file list with its icon-only toolbar; the import settings panel, drawn with the editor's shared property editors (PropertiesExpander groups of PropertyCard rows: Units and axes expanded with the Result row, which says what the import does to the model's size and orientation in Oxygen's space, then Units (Metres) and Up axis; Geometry, Hierarchy, Textures and Lights collapsed; Materials, last as its rows vary with the file, expanded: each source material is a PropertyCard with the material picker button, Glass set to the project's Glass material with its override bar and reset). The facts InfoBar spans the width: a warning bar titled 3 warnings, whose action button, Before import, opens the report as a flyout. The button bar holds Open session and Save session on the left, Import 3 with its chevron (Import disabled while the name of Crates.gltf is taken; its chevron opens the Import run settings) and Cancel. Colours are WinUI 3 dark-theme tokens.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.26"/></filter></defs>
