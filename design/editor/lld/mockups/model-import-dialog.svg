  <g font-size="11" fill="#e0e0e0">
    <rect x="1220" y="40" width="212" height="760" rx="6" fill="#161616" stroke="#4a4a4a"/>
    <text x="1230" y="62" font-weight="600" fill="#ffffff">What the mockup shows</text>
    <text x="1230" y="84">1. Files: extended selection (ME-13),</text>
    <text x="1240" y="99">Ctrl+A selects all. Car.fbx alone</text>
    <text x="1240" y="114">is selected. Glyphs: analysis</text>
    <text x="1240" y="129">problems, name taken.</text>
    <text x="1230" y="151">2. Facts: format and version from</text>
    <text x="1240" y="166">the analysis (E11).</text>
    <text x="1230" y="188">3. Settings: the Model Editor's panel</text>
    <text x="1240" y="203">(ME-11); rows that do not apply</text>
    <text x="1240" y="218">are absent; defaults in secondary</text>
    <text x="1240" y="233">text, a set value has the override</text>
    <text x="1240" y="248">bar and a reset (Glass).</text>
    <text x="1230" y="270">Settings use the editor's shared</text>
    <text x="1240" y="285">property editors: PropertiesExpander</text>
    <text x="1240" y="300">groups, PropertyCard rows (override</text>
    <text x="1240" y="315">bar, reset, responsive layout),</text>
    <text x="1240" y="330">NumberField (units, prefixes,</text>
    <text x="1240" y="345">validation, label scrubbing),</text>
    <text x="1240" y="360">ToggleField, and AssetPickerButton</text>
    <text x="1240" y="375">(Pickers), never the Scene</text>
    <text x="1240" y="390">Inspector project.</text>
    <text x="1230" y="412">4. Node continuity and the selection</text>
    <text x="1240" y="427">groups need a previous import.</text>
    <text x="1230" y="449">5. Facts InfoBar: its severity is</text>
    <text x="1240" y="464">the worst finding's, its title counts</text>
    <text x="1240" y="479">them; its action, Before import,</text>
    <text x="1240" y="494">opens the report as a flyout</text>
    <text x="1240" y="509">(model-import-dialog-selection).</text>
    <text x="1230" y="531">6. List toolbar, icon-only: Add,</text>
    <text x="1240" y="546">Remove | Move up, Move down;</text>
    <text x="1240" y="561">drag reorders. Move up is off:</text>
    <text x="1240" y="576">the first row is selected.</text>
    <text x="1230" y="598">7. Splitter: list | settings (min</text>
    <text x="1240" y="613">560 px).</text>
    <text x="1230" y="635">8. The chevron beside Import</text>
    <text x="1240" y="650">opens the Import run flyout</text>
    <text x="1240" y="665">(model-import-dialog-run).</text>
    <text x="1230" y="687">9. Sessions: an import manifest,</text>
    <text x="1240" y="702">for the editor and the CLI (ME-15).</text>
    <text x="1230" y="724">Layers (WinUI 3 dark tokens):</text>
    <text x="1240" y="739">smoke 30 %, dialog base #202020,</text>
    <text x="1240" y="754">content on LayerFillColorAlt, the</text>
    <text x="1240" y="769">button bar on the base; cards,</text>
    <text x="1240" y="784">inputs and InfoBars above it.</text>
  </g>
</svg>
