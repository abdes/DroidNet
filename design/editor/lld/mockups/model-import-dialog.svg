  <line x1="406" y1="788" x2="1186" y2="788" stroke="#000000" stroke-opacity="0.10"/>
  <text x="420" y="769" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="18" fill="#ffffff">&#xE790;</text>
  <text x="452" y="759" font-weight="600" fill="#ffffff">Materials</text>
  <text x="452" y="776" font-size="12" fill="#ffffff" fill-opacity="0.773">Project materials used instead of the file's.</text>
  <text x="1162" y="767" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.77">&#xE70E;</text>
  <rect x="1014" y="746" width="124" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="1076.0" y="767" text-anchor="middle" fill="#ffffff">Match by name<title>For each material still set to Imported, use the project material with exactly the same name, when there is one.</title></text>
  <text x="426" y="818" fill="#ffffff">Paint</text>
  <rect x="576" y="798" width="562" height="30" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="587" y="818" fill="#ffffff" fill-opacity="0.773">Imported</text>
  <line x1="1104" y1="802" x2="1104" y2="824" stroke="#ffffff" stroke-opacity="0.082"/>
  <text x="1115" y="817" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="10" fill="#ffffff" fill-opacity="0.77">&#xE70D;<title>Choose a project material</title></text>
