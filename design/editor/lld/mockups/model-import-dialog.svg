  <rect x="1144" y="837" width="28" height="28" rx="4" fill="#ffffff" fill-opacity="0.059"/>
  <text x="1151" y="856" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="13" fill="#ffffff">&#xE777;<title>Reset: import the file's Glass material</title></text>
