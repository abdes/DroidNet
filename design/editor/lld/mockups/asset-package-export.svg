<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14">
  <title>Export package review (dark theme)</title>
  <desc>The Export package dialog: the destination folder, then the assets with their destinations, the sources copied in and the dependencies. Export asks for the .zip file.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.26"/></filter></defs>
  <rect width="1440" height="1000" fill="#202020"/>
  <rect x="0" y="0" width="1440" height="44" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="0" y="560" width="930" height="440" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="934" y="44" width="506" height="956" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="0" y="0" width="1440" height="1000" fill="#000000" fill-opacity="0.3"/>
  <rect x="100" y="40" width="1090" height="690" rx="8" fill="#202020" stroke="#757575" stroke-opacity="0.4" filter="url(#shadow)"/>
  <path d="M108,40 H1182 A8,8 0 0 1 1190,48 V660 H100 V48 A8,8 0 0 1 108,40Z" fill="#ffffff" fill-opacity="0.051"/>
  <line x1="100" y1="660" x2="1190" y2="660" stroke="#000000" stroke-opacity="0.1"/>
  <text x="124" y="80" font-size="20" font-weight="600" fill="#ffffff">Export package</text>
  <text x="124" y="104" font-size="13" fill-opacity="0.773" fill="#ffffff">Garage and everything it needs from this project, as one .zip that the library project imports</text>
  <text x="124" y="126" font-size="13" fill="#ffffff">Destination folder</text>
  <rect x="124" y="134" width="300" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <line x1="125" y1="165.5" x2="423" y2="165.5" stroke="#ffffff" stroke-opacity="0.545"/>
  <text x="135" y="155" font-size="13" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer</text>
  <text x="436" y="154" font-size="13" fill-opacity="0.773" fill="#ffffff">Any library and folder. Props is mounted here; suggestions list the libraries and their folders.</text>
  <rect x="124" y="180" width="1042" height="40" rx="4" fill="#2b2b2b" stroke="#000000" stroke-opacity="0.1"/>
  <text x="136" y="206" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#60cdff">&#xE946;</text>
  <text x="160" y="205" font-size="13" font-weight="600" fill="#ffffff">Nothing in Racer changes.</text>
  <text x="343" y="205" font-size="13" fill="#ffffff">After the library ships this content, Replace with library switches Racer over to it.</text>
  <text x="124" y="248" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#ffffff">&#xE8A5;</text>
  <text x="148" y="248" font-weight="600" fill="#ffffff">Assets</text>
  <text x="196" y="248" font-size="12" fill-opacity="0.773" fill="#ffffff">1 selected · 36 it needs · package root /Content</text>
  <line x1="124" y1="257" x2="1166" y2="257" stroke="#ffffff" stroke-opacity="0.082"/>
  <text x="148" y="278" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Levels/Garage/Garage.oscene</text>
  <text x="572" y="279" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="278" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Levels/Garage/Garage.oscene</text>
  <text x="1166" y="278" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">Selected · Scene</text>
  <text x="148" y="302" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Cars/Truck.fbx</text>
  <text x="572" y="303" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="302" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Cars/Truck.fbx</text>
  <text x="1166" y="302" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">Model</text>
  <text x="148" y="326" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Materials/Rust.omat</text>
  <text x="572" y="327" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="326" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Materials/Rust.omat</text>
  <text x="1166" y="326" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">Material</text>
  <text x="148" y="350" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Textures/Brick.otex</text>
  <text x="572" y="351" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="350" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Textures/Brick.otex</text>
  <text x="1166" y="350" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">Texture</text>
  <text x="148" y="374" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Input/Car.input</text>
  <text x="572" y="375" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="374" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Input/Car.input</text>
  <text x="1166" y="374" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">Input</text>
  <text x="148" y="398" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Scripts/door.lua</text>
  <text x="572" y="399" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="398" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Scripts/door.lua</text>
  <text x="1166" y="398" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">Script</text>
  <text x="148" y="422" font-size="12" fill-opacity="0.773" fill="#ffffff">and 31 more, by scrolling</text>
  <text x="124" y="458" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#ffffff">&#xE8B5;</text>
  <text x="148" y="458" font-weight="600" fill="#ffffff">Sources copied in</text>
  <text x="284" y="458" font-size="12" fill-opacity="0.773" fill="#ffffff">2 · read from other mounts, so the package cooks anywhere</text>
  <line x1="124" y1="467" x2="1166" y2="467" stroke="#ffffff" stroke-opacity="0.082"/>
  <text x="148" y="488" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/RawMedia/Cars/Truck.fbx</text>
  <text x="572" y="489" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="488" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Cars/Truck.fbx (its companion)</text>
  <text x="1166" y="488" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">412 MB</text>
  <text x="148" y="512" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/RawMedia/Walls/Brick.png</text>
  <text x="572" y="513" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="512" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Textures/Brick.png (its companion)</text>
  <text x="1166" y="512" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">6 MB</text>
  <text x="124" y="548" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#ffffff">&#xE71B;</text>
  <text x="148" y="548" font-weight="600" fill="#ffffff">Needs, not carried</text>
  <text x="292" y="548" font-size="12" fill-opacity="0.773" fill="#ffffff">2 mounts · the library must have them</text>
  <line x1="124" y1="557" x2="1166" y2="557" stroke="#ffffff" stroke-opacity="0.082"/>
  <text x="148" y="578" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Engine</text>
  <text x="1166" y="578" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">4 assets</text>
  <text x="148" y="602" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Vehicles</text>
  <text x="1166" y="602" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">12 assets</text>
  <text x="148" y="634" font-size="12" fill-opacity="0.773" fill="#ffffff">References into /Props stay absolute in the package; importing into Props respells them relative.</text>
  <rect x="946" y="678" width="126" height="32" rx="4" fill="#60cdff"/>
  <text x="1009.0" y="699" text-anchor="middle" fill="#000000">Export…<title>Asks where to write the .zip</title></text>
  <rect x="1082" y="678" width="84" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="1124.0" y="699" text-anchor="middle" fill="#ffffff">Cancel</text>
  <rect x="1200" y="40" width="232" height="700" rx="6" fill="#161616" stroke="#4a4a4a"/>
  <text x="1210" y="62" font-size="11" font-weight="600" fill="#ffffff">What the mockup shows</text>
  <text x="1210" y="84" font-size="11" fill="#e0e0e0">1. Opens on the selection; the review</text>
  <text x="1220" y="99" font-size="11" fill="#e0e0e0">builds from the relocation planner&#x27;s</text>
  <text x="1220" y="114" font-size="11" fill="#e0e0e0">closure before the dialog shows, with a</text>
  <text x="1220" y="129" font-size="11" fill="#e0e0e0">progress ring for a large closure.</text>
  <text x="1210" y="151" font-size="11" fill="#e0e0e0">2. The destination is typed text with</text>
  <text x="1220" y="166" font-size="11" fill="#e0e0e0">AutoSuggest over mounted libraries and</text>
  <text x="1220" y="181" font-size="11" fill="#e0e0e0">their folders, as a promotion may target</text>
  <text x="1220" y="196" font-size="11" fill="#e0e0e0">a library not mounted here. Its grammar</text>
  <text x="1220" y="211" font-size="11" fill="#e0e0e0">is checked as typed, and Export is off</text>
  <text x="1220" y="226" font-size="11" fill="#e0e0e0">on a bad path.</text>
  <text x="1210" y="248" font-size="11" fill="#e0e0e0">3. Only the destination is a choice.</text>
  <text x="1220" y="263" font-size="11" fill="#e0e0e0">Nothing in the list can be unticked:</text>
  <text x="1220" y="278" font-size="11" fill="#e0e0e0">leaving out a needed asset would break</text>
  <text x="1220" y="293" font-size="11" fill="#e0e0e0">R3, so the review informs and does not</text>
  <text x="1220" y="308" font-size="11" fill="#e0e0e0">edit.</text>
  <text x="1210" y="330" font-size="11" fill="#e0e0e0">4. Selected marks what the user picked;</text>
  <text x="1220" y="345" font-size="11" fill="#e0e0e0">the rest were pulled in. Rows sort</text>
  <text x="1220" y="360" font-size="11" fill="#e0e0e0">selected first, then by path.</text>
  <text x="1210" y="382" font-size="11" fill="#e0e0e0">5. Root: the deepest folder holding</text>
  <text x="1220" y="397" font-size="11" fill="#e0e0e0">everything, shown so the mapping reads</text>
  <text x="1220" y="412" font-size="11" fill="#e0e0e0">plainly. A closure in two own mounts has</text>
  <text x="1220" y="427" font-size="11" fill="#e0e0e0">no such folder, so the root is the</text>
  <text x="1220" y="442" font-size="11" fill="#e0e0e0">virtual root and each mount becomes a</text>
  <text x="1220" y="457" font-size="11" fill="#e0e0e0">folder (/Props/Racer/Content/…,</text>
  <text x="1220" y="472" font-size="11" fill="#e0e0e0">/Props/Racer/Art/…).</text>
  <text x="1210" y="494" font-size="11" fill="#e0e0e0">6. Sizes on copied sources warn of a</text>
  <text x="1220" y="509" font-size="11" fill="#e0e0e0">large package before writing.</text>
  <text x="1210" y="531" font-size="11" fill="#e0e0e0">7. Dependencies are listed by mount; a</text>
  <text x="1220" y="546" font-size="11" fill="#e0e0e0">row expands to its asset paths. An asset</text>
  <text x="1220" y="561" font-size="11" fill="#e0e0e0">in /RawMedia that is not a source is a</text>
  <text x="1220" y="576" font-size="11" fill="#e0e0e0">dependency too.</text>
  <text x="1210" y="598" font-size="11" fill="#e0e0e0">8. Export… opens the save picker,</text>
  <text x="1220" y="613" font-size="11" fill="#e0e0e0">defaulting to &lt;selection name&gt;.zip, and</text>
  <text x="1220" y="628" font-size="11" fill="#e0e0e0">shows progress in the dialog. It ends in</text>
  <text x="1220" y="643" font-size="11" fill="#e0e0e0">the status text, with no Undo: only a</text>
  <text x="1220" y="658" font-size="11" fill="#e0e0e0">file was written.</text>
</svg>
