<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14">
  <title>Replace with library review (dark theme)</title>
  <desc>The Replace with library dialog: the assets the library now provides, the ones it does not, and the ones changed since export. Replace commits one Undo step.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.26"/></filter></defs>
  <rect width="1440" height="1000" fill="#202020"/>
  <rect x="0" y="0" width="1440" height="44" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="0" y="560" width="930" height="440" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="934" y="44" width="506" height="956" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="0" y="0" width="1440" height="1000" fill="#000000" fill-opacity="0.3"/>
  <rect x="100" y="40" width="1090" height="560" rx="8" fill="#202020" stroke="#757575" stroke-opacity="0.4" filter="url(#shadow)"/>
  <path d="M108,40 H1182 A8,8 0 0 1 1190,48 V530 H100 V48 A8,8 0 0 1 108,40Z" fill="#ffffff" fill-opacity="0.051"/>
  <line x1="100" y1="530" x2="1190" y2="530" stroke="#000000" stroke-opacity="0.1"/>
  <text x="124" y="80" font-size="20" font-weight="600" fill="#ffffff">Replace with library</text>
  <text x="124" y="104" font-size="13" fill-opacity="0.773" fill="#ffffff">Garage.zip · Racer stops using its local copies and uses what /Props now provides</text>
  <text x="124" y="136" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#6ccb5f">&#xE73E;</text>
  <text x="148" y="136" font-weight="600" fill="#ffffff">Replaced</text>
  <text x="212" y="136" font-size="12" fill-opacity="0.773" fill="#ffffff">34 · unchanged since export, and the library provides them · the local copy is deleted</text>
  <line x1="124" y1="145" x2="1166" y2="145" stroke="#ffffff" stroke-opacity="0.082"/>
  <text x="148" y="166" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Levels/Garage/Garage.oscene</text>
  <text x="572" y="167" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="166" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Levels/Garage/Garage.oscene</text>
  <text x="1166" y="166" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">3 files use it</text>
  <text x="148" y="190" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Cars/Truck.fbx</text>
  <text x="572" y="191" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="190" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Cars/Truck.fbx</text>
  <text x="1166" y="190" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">8 files use it</text>
  <text x="148" y="214" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Input/Car.input</text>
  <text x="572" y="215" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="214" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Input/Car.input</text>
  <text x="1166" y="214" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">2 files use it</text>
  <text x="148" y="238" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Scripts/door.lua</text>
  <text x="572" y="239" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="238" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Scripts/door.lua</text>
  <text x="1166" y="238" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">1 file uses it</text>
  <text x="148" y="262" font-size="12" fill-opacity="0.773" fill="#ffffff">and 30 more, by scrolling</text>
  <text x="124" y="298" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#ffffff">&#xE946;</text>
  <text x="148" y="298" font-weight="600" fill="#ffffff">Not in the library</text>
  <text x="292" y="298" font-size="12" fill-opacity="0.773" fill="#ffffff">1 · kept · it may arrive in a later release: run this again with the same package</text>
  <line x1="124" y1="307" x2="1166" y2="307" stroke="#ffffff" stroke-opacity="0.082"/>
  <text x="148" y="328" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Materials/Rust.omat</text>
  <text x="572" y="329" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="328" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Materials/Rust.omat</text>
  <text x="1166" y="328" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">Not provided</text>
  <text x="124" y="364" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#fce100">&#xE7BA;</text>
  <text x="148" y="364" font-weight="600" fill="#ffffff">Changed since export</text>
  <text x="308" y="364" font-size="12" fill-opacity="0.773" fill="#ffffff">2 · kept as they are, never replaced</text>
  <line x1="124" y1="373" x2="1166" y2="373" stroke="#ffffff" stroke-opacity="0.082"/>
  <text x="148" y="394" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Textures/Brick.otex</text>
  <text x="572" y="395" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="394" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Textures/Brick.otex</text>
  <text x="1166" y="394" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">Edited locally</text>
  <text x="148" y="418" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Props/Lamp.glb</text>
  <text x="572" y="419" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.773">&#xE72A;</text>
  <text x="594" y="418" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Props/Racer/Props/Lamp.glb</text>
  <text x="1166" y="418" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">Deleted locally</text>
  <text x="124" y="466" font-size="13" fill-opacity="0.773" fill="#ffffff">Files that used a replaced asset are rewritten to the library path. Undo restores the local copies and every reference.</text>
  <rect x="946" y="548" width="126" height="32" rx="4" fill="#60cdff"/>
  <text x="1009.0" y="569" text-anchor="middle" fill="#000000">Replace 34</text>
  <rect x="1082" y="548" width="84" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="1124.0" y="569" text-anchor="middle" fill="#ffffff">Cancel</text>
  <rect x="1200" y="40" width="232" height="700" rx="6" fill="#161616" stroke="#4a4a4a"/>
  <text x="1210" y="62" font-size="11" font-weight="600" fill="#ffffff">What the mockup shows</text>
  <text x="1210" y="84" font-size="11" fill="#e0e0e0">1. R11&#x27;s three lists, in its order,</text>
  <text x="1220" y="99" font-size="11" fill="#e0e0e0">computed from the package and the</text>
  <text x="1220" y="114" font-size="11" fill="#e0e0e0">mounted table only: no state is stored.</text>
  <text x="1210" y="136" font-size="11" fill="#e0e0e0">2. Each row maps local path to library</text>
  <text x="1220" y="151" font-size="11" fill="#e0e0e0">path; the last column is why it landed</text>
  <text x="1220" y="166" font-size="11" fill="#e0e0e0">there, or how many referrers change.</text>
  <text x="1210" y="188" font-size="11" fill="#e0e0e0">3. A row of another type in the library</text>
  <text x="1220" y="203" font-size="11" fill="#e0e0e0">says Provided as another type (Texture),</text>
  <text x="1220" y="218" font-size="11" fill="#e0e0e0">in Not in the library.</text>
  <text x="1210" y="240" font-size="11" fill="#e0e0e0">4. Nothing replaceable: Replace is</text>
  <text x="1220" y="255" font-size="11" fill="#e0e0e0">disabled and the dialog says why; the</text>
  <text x="1220" y="270" font-size="11" fill="#e0e0e0">lists stay readable, as they answer why</text>
  <text x="1220" y="285" font-size="11" fill="#e0e0e0">Garage did not arrive.</text>
  <text x="1210" y="307" font-size="11" fill="#e0e0e0">5. A library not mounted, or Invalid: a</text>
  <text x="1220" y="322" font-size="11" fill="#e0e0e0">warning bar names the mount, with an</text>
  <text x="1220" y="337" font-size="11" fill="#e0e0e0">action opening the mounts dialog. Every</text>
  <text x="1220" y="352" font-size="11" fill="#e0e0e0">row is then Not in the library.</text>
  <text x="1210" y="374" font-size="11" fill="#e0e0e0">6. The primary button states the count,</text>
  <text x="1220" y="389" font-size="11" fill="#e0e0e0">as Import 3 does in the import dialog.</text>
  <text x="1220" y="404" font-size="11" fill="#e0e0e0">Open dirty files ask to save first; the</text>
  <text x="1220" y="419" font-size="11" fill="#e0e0e0">relocation journal gives the one Undo</text>
  <text x="1220" y="434" font-size="11" fill="#e0e0e0">step.</text>
  <text x="1210" y="456" font-size="11" fill="#e0e0e0">7. No per-row choice: an unchanged asset</text>
  <text x="1220" y="471" font-size="11" fill="#e0e0e0">the library provides is replaced. A</text>
  <text x="1220" y="486" font-size="11" fill="#e0e0e0">developer who wants a local copy keeps</text>
  <text x="1220" y="501" font-size="11" fill="#e0e0e0">it by not running this, or by editing it</text>
  <text x="1220" y="516" font-size="11" fill="#e0e0e0">first.</text>
  <text x="1210" y="538" font-size="11" fill="#e0e0e0">8. Running it again after a later</text>
  <text x="1220" y="553" font-size="11" fill="#e0e0e0">release replaces what has arrived; rows</text>
  <text x="1220" y="568" font-size="11" fill="#e0e0e0">already replaced no longer exist locally</text>
  <text x="1220" y="583" font-size="11" fill="#e0e0e0">and are not listed.</text>
  <text x="1210" y="605" font-size="11" fill="#e0e0e0">9. Result in the status text: Replaced</text>
  <text x="1220" y="620" font-size="11" fill="#e0e0e0">34; 3 kept.</text>
</svg>
