  <text x="260" y="569" font-size="13" fill="#c5c5c5">R</text>
  <rect x="276" y="550" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="344" y="569" text-anchor="end" fill="#ffffff">0.35</text>
  <text x="364" y="569" font-size="13" fill="#c5c5c5">G</text>
  <rect x="380" y="550" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="448" y="569" text-anchor="end" fill="#ffffff">0.35</text>
  <text x="468" y="569" font-size="13" fill="#c5c5c5">B</text>
  <rect x="484" y="550" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="552" y="569" text-anchor="end" fill="#ffffff">0.35</text>
  <text x="572" y="569" font-size="13" fill="#c5c5c5">A</text>
  <rect x="588" y="550" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="656" y="569" text-anchor="end" fill="#ffffff">1</text>
  <text x="678" y="569" font-size="12" fill="#c5c5c5">Linear RGBA</text>
  <text x="52" y="604" fill="#ffffff">Major</text>
  <rect x="224" y="586" width="28" height="28" rx="4" fill="#8c8c8c" stroke="#3a3a3a"/>
  <text x="260" y="605" font-size="13" fill="#c5c5c5">R</text>
  <rect x="276" y="586" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="344" y="605" text-anchor="end" fill="#ffffff">0.55</text>
  <text x="364" y="605" font-size="13" fill="#c5c5c5">G</text>
  <rect x="380" y="586" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="448" y="605" text-anchor="end" fill="#ffffff">0.55</text>
  <text x="468" y="605" font-size="13" fill="#c5c5c5">B</text>
  <rect x="484" y="586" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="552" y="605" text-anchor="end" fill="#ffffff">0.55</text>
  <text x="572" y="605" font-size="13" fill="#c5c5c5">A</text>
  <rect x="588" y="586" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="656" y="605" text-anchor="end" fill="#ffffff">1</text>
  <text x="678" y="605" font-size="12" fill="#c5c5c5">Linear RGBA</text>
  <text x="52" y="640" fill="#ffffff">X axis</text>
  <rect x="224" y="622" width="28" height="28" rx="4" fill="#e63333" stroke="#3a3a3a"/>
  <text x="260" y="641" font-size="13" fill="#c5c5c5">R</text>
  <rect x="276" y="622" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="344" y="641" text-anchor="end" fill="#ffffff">0.9</text>
  <text x="364" y="641" font-size="13" fill="#c5c5c5">G</text>
  <rect x="380" y="622" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="448" y="641" text-anchor="end" fill="#ffffff">0.2</text>
  <text x="468" y="641" font-size="13" fill="#c5c5c5">B</text>
  <rect x="484" y="622" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="552" y="641" text-anchor="end" fill="#ffffff">0.2</text>
  <text x="572" y="641" font-size="13" fill="#c5c5c5">A</text>
  <rect x="588" y="622" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="656" y="641" text-anchor="end" fill="#ffffff">1</text>
  <text x="678" y="641" font-size="12" fill="#c5c5c5">Linear RGBA</text>
  <text x="52" y="676" fill="#ffffff">Y axis</text>
  <rect x="224" y="658" width="28" height="28" rx="4" fill="#3399e6" stroke="#3a3a3a"/>
  <text x="260" y="677" font-size="13" fill="#c5c5c5">R</text>
  <rect x="276" y="658" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="344" y="677" text-anchor="end" fill="#ffffff">0.2</text>
  <text x="364" y="677" font-size="13" fill="#c5c5c5">G</text>
  <rect x="380" y="658" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="448" y="677" text-anchor="end" fill="#ffffff">0.6</text>
  <text x="468" y="677" font-size="13" fill="#c5c5c5">B</text>
  <rect x="484" y="658" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="552" y="677" text-anchor="end" fill="#ffffff">0.9</text>
  <text x="572" y="677" font-size="13" fill="#c5c5c5">A</text>
  <rect x="588" y="658" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="656" y="677" text-anchor="end" fill="#ffffff">1</text>
  <text x="678" y="677" font-size="12" fill="#c5c5c5">Linear RGBA</text>
  <text x="52" y="712" fill="#ffffff">Origin</text>
  <rect x="224" y="694" width="28" height="28" rx="4" fill="#ffffff" stroke="#3a3a3a"/>
  <text x="260" y="713" font-size="13" fill="#c5c5c5">R</text>
  <rect x="276" y="694" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="344" y="713" text-anchor="end" fill="#ffffff">1</text>
  <text x="364" y="713" font-size="13" fill="#c5c5c5">G</text>
  <rect x="380" y="694" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="448" y="713" text-anchor="end" fill="#ffffff">1</text>
  <text x="468" y="713" font-size="13" fill="#c5c5c5">B</text>
  <rect x="484" y="694" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="552" y="713" text-anchor="end" fill="#ffffff">1</text>
  <text x="572" y="713" font-size="13" fill="#c5c5c5">A</text>
  <rect x="588" y="694" width="76" height="28" rx="4" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="656" y="713" text-anchor="end" fill="#ffffff">1</text>
  <text x="678" y="713" font-size="12" fill="#c5c5c5">Linear RGBA</text>
  <text x="930" y="30" font-size="16" font-weight="600" fill="#ffffff">Decisions</text>
  <line x1="890" y1="154" x2="926" y2="71" stroke="#555555" stroke-dasharray="3 3"/>
  <circle cx="939" cy="71" r="9" fill="#4cc2ff"/>
  <text x="939" y="75" font-size="11" font-weight="600" text-anchor="middle" fill="#000000">1</text>
  <text x="956" y="76" font-size="13" font-weight="600" fill="#ffffff">Its own section, after PBR</text>
  <text x="956" y="94" font-size="12" fill="#c5c5c5">A grid replaces how the surface looks, so</text>
  <text x="956" y="110" font-size="12" fill="#c5c5c5">it is no Advanced detail.</text>
  <line x1="890" y1="154" x2="926" y2="131" stroke="#555555" stroke-dasharray="3 3"/>
  <circle cx="939" cy="131" r="9" fill="#4cc2ff"/>
  <text x="939" y="135" font-size="11" font-weight="600" text-anchor="middle" fill="#000000">2</text>
  <text x="956" y="136" font-size="13" font-weight="600" fill="#ffffff">Off shows one row</text>
  <text x="956" y="154" font-size="12" fill="#c5c5c5">Twelve dead rows would be noise. The</text>
  <text x="956" y="170" font-size="12" fill="#c5c5c5">section stays where it is either way.</text>
  <line x1="890" y1="268" x2="926" y2="191" stroke="#555555" stroke-dasharray="3 3"/>
  <circle cx="939" cy="191" r="9" fill="#4cc2ff"/>
  <text x="939" y="195" font-size="11" font-weight="600" text-anchor="middle" fill="#000000">3</text>
  <text x="956" y="196" font-size="13" font-weight="600" fill="#ffffff">The toggle is the file's presence</text>
  <text x="956" y="214" font-size="12" fill="#c5c5c5">On writes an empty procedural_grid, so</text>
  <text x="956" y="230" font-size="12" fill="#c5c5c5">every value is the engine's default.</text>
  <text x="956" y="246" font-size="12" fill="#c5c5c5">Off removes it with its values; undo</text>
  <text x="956" y="262" font-size="12" fill="#c5c5c5">brings them back.</text>
  <line x1="890" y1="364" x2="926" y2="291" stroke="#555555" stroke-dasharray="3 3"/>
  <circle cx="939" cy="291" r="9" fill="#4cc2ff"/>
  <text x="939" y="295" font-size="11" font-weight="600" text-anchor="middle" fill="#000000">4</text>
  <text x="956" y="296" font-size="13" font-weight="600" fill="#ffffff">Bar and reset as on the texture slots</text>
  <text x="956" y="314" font-size="12" fill="#c5c5c5">A value not at the default is marked, and</text>
  <text x="956" y="330" font-size="12" fill="#c5c5c5">reset stops writing it.</text>
  <line x1="890" y1="404" x2="926" y2="357" stroke="#555555" stroke-dasharray="3 3"/>
  <circle cx="939" cy="357" r="9" fill="#4cc2ff"/>
  <text x="939" y="361" font-size="11" font-weight="600" text-anchor="middle" fill="#000000">5</text>
  <text x="956" y="362" font-size="13" font-weight="600" fill="#ffffff">Spacing in metres</text>
  <text x="956" y="380" font-size="12" fill="#c5c5c5">The card's m qualifier, as on Transform</text>
  <text x="956" y="396" font-size="12" fill="#c5c5c5">position. Grid units are world units.</text>
  <line x1="890" y1="436" x2="926" y2="423" stroke="#555555" stroke-dasharray="3 3"/>
  <circle cx="939" cy="423" r="9" fill="#4cc2ff"/>
  <text x="939" y="427" font-size="11" font-weight="600" text-anchor="middle" fill="#000000">6</text>
  <text x="956" y="428" font-size="13" font-weight="600" fill="#ffffff">Thickness as three boxes in one row</text>
  <text x="956" y="446" font-size="12" fill="#c5c5c5">One idea, one row. Metres, not pixels: the</text>
  <text x="956" y="462" font-size="12" fill="#c5c5c5">shader divides them by the spacing. Shown</text>
  <text x="956" y="478" font-size="12" fill="#c5c5c5">with the ground grid's values, your call.</text>
  <line x1="890" y1="500" x2="926" y2="507" stroke="#555555" stroke-dasharray="3 3"/>
  <circle cx="939" cy="507" r="9" fill="#4cc2ff"/>
  <text x="939" y="511" font-size="11" font-weight="600" text-anchor="middle" fill="#000000">7</text>
  <text x="956" y="512" font-size="13" font-weight="600" fill="#ffffff">Start and End in one row</text>
  <text x="956" y="530" font-size="12" fill="#c5c5c5">They only mean something together. No</text>
  <text x="956" y="546" font-size="12" fill="#c5c5c5">caption: 0 and 0 is the default and means</text>
  <text x="956" y="562" font-size="12" fill="#c5c5c5">no fade, as in the shader.</text>
  <line x1="890" y1="564" x2="926" y2="591" stroke="#555555" stroke-dasharray="3 3"/>
  <circle cx="939" cy="591" r="9" fill="#4cc2ff"/>
  <text x="939" y="595" font-size="11" font-weight="600" text-anchor="middle" fill="#000000">8</text>
  <text x="956" y="596" font-size="13" font-weight="600" fill="#ffffff">ColorField, Kind Linear, with alpha</text>
  <text x="956" y="614" font-size="12" fill="#c5c5c5">It labels itself Linear RGBA and keeps 0 to 1,</text>
  <text x="956" y="630" font-size="12" fill="#c5c5c5">the schema's range. Not Luminance, which</text>
  <text x="956" y="646" font-size="12" fill="#c5c5c5">may exceed 1; not Multiplier, which has no picker.</text>
</svg>
