<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14">
  <title>Material Editor procedural grid section (dark theme)</title>
  <desc>The Procedural Grid section of the Material Editor, off with a single Show grid toggle, and on with spacing, major line interval, thickness, fade distance and five colors. Annotations on the right give the reason for each decision.</desc>
  <rect width="1300" height="760" fill="#1c1c1c"/>
  <text x="20" y="30" font-size="13" fill="#8a8a8a">Material Editor: procedural grid</text>
  <text x="20" y="62" font-size="12" fill="#8a8a8a">Off: a material without a grid</text>
  <rect x="20" y="72" width="880" height="108" rx="8" fill="#272727" stroke="#1d1d1d"/>
  <rect x="21" y="73" width="878" height="54" rx="8" fill="#2b2b2b"/>
  <line x1="20" y1="128" x2="900" y2="128" stroke="#1d1d1d"/>
  <text x="34" y="106" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="18" fill="#ffffff">&#xE80A;</text>
  <text x="66" y="96" font-weight="600" fill="#ffffff">Procedural Grid</text>
  <text x="66" y="114" font-size="12" fill="#c5c5c5">A world-space grid drawn on any surface, over its base color and unaffected by light.</text>
  <text x="876" y="105" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#c5c5c5">&#xE70E;</text>
  <text x="52" y="158" fill="#ffffff">Show grid</text>
  <rect x="224" y="143" width="40" height="20" rx="10" fill="none" stroke="#c5c5c5"/>
  <circle cx="235" cy="153" r="5" fill="#c5c5c5"/>
  <text x="20" y="208" font-size="12" fill="#8a8a8a">On: spacing and a fade changed</text>
  <rect x="20" y="218" width="880" height="525" rx="8" fill="#272727" stroke="#1d1d1d"/>
  <rect x="21" y="219" width="878" height="54" rx="8" fill="#2b2b2b"/>
  <line x1="20" y1="274" x2="900" y2="274" stroke="#1d1d1d"/>
  <text x="34" y="252" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="18" fill="#ffffff">&#xE80A;</text>
  <text x="66" y="242" font-weight="600" fill="#ffffff">Procedural Grid</text>
  <text x="66" y="260" font-size="12" fill="#c5c5c5">A world-space grid drawn on any surface, over its base color and unaffected by light.</text>
  <text x="876" y="251" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#c5c5c5">&#xE70E;</text>
