  <line x1="95" y1="336" x2="860" y2="336" stroke="#333333"/>
  <rect x="44" y="352" width="3" height="24" rx="1" fill="#4cc2ff"/>
  <text x="852" y="368" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="12" fill="#ffffff">&#xE777;</text>
  <text x="52" y="368" fill="#ffffff">Spacing</text>
