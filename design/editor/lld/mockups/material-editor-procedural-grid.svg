  <text x="52" y="540" font-size="12" font-weight="600" fill="#8a8a8a">Colors</text>
  <line x1="102" y1="536" x2="860" y2="536" stroke="#333333"/>
  <text x="52" y="568" fill="#ffffff">Minor</text>
