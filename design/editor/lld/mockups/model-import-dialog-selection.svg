  <text x="955" y="440" font-size="13" font-weight="600" fill="#ffffff">Crates.gltf</text>
  <rect x="955" y="448" width="231" height="101" rx="4" fill="#442726" stroke="#000000" stroke-opacity="0.10"/>
  <text x="967" y="470" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#ff99a4">&#xEA39;</text>
  <text x="991" y="470" font-size="13" fill="#ffffff">A model named Crates is</text>
  <text x="991" y="487" font-size="13" fill="#ffffff">already in Content/Props.</text>
  <text x="991" y="504" font-size="13" fill="#ffffff">Select it alone to rename</text>
  <text x="991" y="521" font-size="13" fill="#ffffff">it, or review the</text>
  <text x="991" y="538" font-size="13" fill="#ffffff">replacement.</text>
