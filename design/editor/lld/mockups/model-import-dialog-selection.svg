  <g font-size="11" fill="#e0e0e0">
    <rect x="1220" y="40" width="212" height="760" rx="6" fill="#161616" stroke="#4a4a4a"/>
    <text x="1230" y="62" font-weight="600" fill="#ffffff">What the mockup shows</text>
    <text x="1230" y="84">1. All three files selected (ME-13):</text>
    <text x="1240" y="99">the dialog shows what they share.</text>
    <text x="1230" y="121">2. Folders differ: Content folder</text>
    <text x="1240" y="136">reads Mixed; typing or Browse</text>
    <text x="1240" y="151">sets every selected file.</text>
    <text x="1230" y="173">3. Normals set on all three: full</text>
    <text x="1240" y="188">override bar and reset. Smoothing</text>
    <text x="1240" y="203">angle set on one file: Mixed (an</text>
    <text x="1240" y="218">indeterminate number), half bar;</text>
    <text x="1240" y="233">reset clears it where it is set.</text>
    <text x="1230" y="255">4. Up axis applies to the FBX file</text>
    <text x="1240" y="270">only: its qualifier says so, and</text>
    <text x="1240" y="285">an edit changes only that file.</text>
    <text x="1230" y="307">5. Name, Scene and Materials</text>
    <text x="1240" y="322">belong to one file's content:</text>
    <text x="1240" y="337">select that file alone.</text>
    <text x="1230" y="359">6. Before import, grouped by file;</text>
    <text x="1240" y="374">a taken name blocks Import until</text>
    <text x="1240" y="389">renamed or reviewed.</text>
    <text x="1230" y="411">Settings use the inspector's own</text>
    <text x="1240" y="426">controls: PropertiesExpander groups,</text>
    <text x="1240" y="441">PropertyCard rows (override bar,</text>
    <text x="1240" y="456">reset, responsive layout), Inspector-</text>
    <text x="1240" y="471">NumberField (units, prefixes,</text>
    <text x="1240" y="486">validation, label scrubbing),</text>
    <text x="1240" y="501">InspectorToggleField, and Asset-</text>
    <text x="1240" y="516">PickerButton (Pickers), never the</text>
    <text x="1240" y="531">Scene Inspector project.</text>
    <text x="1230" y="553">Layers (WinUI 3 dark tokens):</text>
    <text x="1240" y="568">smoke 30 %, dialog base #202020,</text>
    <text x="1240" y="583">content on LayerFillColorAlt, the</text>
    <text x="1240" y="598">button bar on the base; cards,</text>
    <text x="1240" y="613">inputs and InfoBars above it.</text>
  </g>
</svg>
