  <text x="452" y="731" font-weight="600" fill="#ffffff">Materials</text>
  <text x="452" y="748" font-size="12" fill="#ffffff" fill-opacity="0.773">Project materials used instead of the file's.</text>
  <text x="913" y="739" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.77">&#xE70E;</text>
  <text x="426" y="790" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="13" fill="#ffffff" fill-opacity="0.77">&#xE946;</text>
  <text x="448" y="790" font-size="13" fill="#ffffff" fill-opacity="0.773">Select one file to choose its scene and replace its materials.</text>
  <rect x="406" y="818" width="531" height="52" rx="8" fill="#ffffff" fill-opacity="0.031" stroke="#000000" stroke-opacity="0.10"/>
  <rect x="406" y="818" width="531" height="52" rx="8" fill="#ffffff" fill-opacity="0.051"/>
  <text x="420" y="851" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="18" fill="#ffffff">&#xE91B;</text>
  <text x="452" y="841" font-weight="600" fill="#ffffff">Textures</text>
  <text x="452" y="858" font-size="12" fill="#ffffff" fill-opacity="0.773">Size, compression and normal map convention.</text>
  <text x="913" y="849" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.77">&#xE70D;</text>
  <rect x="406" y="878" width="531" height="52" rx="8" fill="#ffffff" fill-opacity="0.031" stroke="#000000" stroke-opacity="0.10"/>
  <rect x="406" y="878" width="531" height="52" rx="8" fill="#ffffff" fill-opacity="0.051"/>
