  <text x="452" y="901" font-weight="600" fill="#ffffff">Lights and cameras</text>
  <text x="452" y="918" font-size="12" fill="#ffffff" fill-opacity="0.773">What the file's lights and cameras bring in.</text>
  <text x="913" y="909" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="11" fill="#ffffff" fill-opacity="0.77">&#xE70D;</text>
