<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14">
  <title>Import model dialog, several files selected (dark theme)</title>
  <desc>The Import model dialog with all three files selected. The name row is absent and the content folder reads Mixed. An informational InfoBar says the settings apply to every selected file. The settings panel, drawn with the inspector's controls, edits the three files: Up axis applies to FBX files only (its qualifier says so); Normals is set on all three (full override bar, reset); the smoothing angle, an InspectorNumberField in degrees, differs between files and reads Mixed with a half override bar; Materials asks to select one file. Before import groups its InfoBars under each file, with a taken name. Import 3 is disabled. Colours are WinUI 3 dark-theme tokens.</desc>
