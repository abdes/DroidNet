<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14">
  <title>Import model dialog, no file yet (dark theme)</title>
  <desc>The Import model dialog before any file is added, as Import > Source model opens it. Instead of an empty list and an empty settings panel, one empty state fills the dialog's content: the import glyph, the title Add models to import, a line saying files can be added, dropped from File Explorer or brought back from an import session, and two buttons, Add files (accent) and Open session. The whole content accepts files dropped from File Explorer. In the button bar, Save session and Import are disabled until a file is listed; the chevron of Import still opens the Import run settings. Colours are WinUI 3 dark-theme tokens.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.26"/></filter></defs>
  <rect width="1440" height="1000" fill="#202020"/>
  <rect x="0" y="0" width="1440" height="44" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="0" y="560" width="930" height="440" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="934" y="44" width="506" height="956" fill="#ffffff" fill-opacity="0.03"/>
  <rect width="1440" height="1000" fill="#000000" fill-opacity="0.30"/>
  <rect x="150" y="40" width="1060" height="920" rx="8" fill="#202020" stroke="#757575" stroke-opacity="0.40" filter="url(#shadow)"/>
  <path d="M158,40 H1202 A8,8 0 0 1 1210,48 V890 H150 V48 A8,8 0 0 1 158,40Z" fill="#ffffff" fill-opacity="0.051"/>
  <line x1="150" y1="890" x2="1210" y2="890" stroke="#000000" stroke-opacity="0.10"/>
  <text x="174" y="80" font-size="20" font-weight="600" fill="#ffffff">Import model</text>
  <text x="174" y="104" font-size="13" fill="#ffffff" fill-opacity="0.773">Models are analysed when they are added, without loading their buffers, and import as one run</text>
  <text x="680.0" y="420" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="48" fill="#ffffff" fill-opacity="0.786" text-anchor="middle">&#xE8B5;<title>Import</title></text>
  <text x="680.0" y="478" font-size="20" font-weight="600" text-anchor="middle" fill="#ffffff">Add models to import</text>
  <text x="680.0" y="508" font-size="14" text-anchor="middle" fill="#ffffff" fill-opacity="0.773">Add glTF or FBX files, drop them here from File Explorer, or open an import</text>
  <text x="680.0" y="528" font-size="14" text-anchor="middle" fill="#ffffff" fill-opacity="0.773">session to import a set of models again.</text>
  <rect x="546.0" y="556" width="128" height="32" rx="4" fill="#4cc2ff"/>
  <text x="610.0" y="577" text-anchor="middle" fill="#000000">Add files…<title>Add files… (Ctrl+O)</title></text>
  <rect x="686.0" y="556" width="128" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="750.0" y="577" text-anchor="middle" fill="#ffffff">Open session…</text>
  <rect x="174" y="908" width="124" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="236.0" y="929" text-anchor="middle" fill="#ffffff">Open session…</text>
  <rect x="308" y="908" width="124" height="32" rx="4" fill="#ffffff" fill-opacity="0.043" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="370.0" y="929" text-anchor="middle" fill="#ffffff" fill-opacity="0.36">Save session…<title>Disabled while no file is listed</title></text>
  <rect x="936" y="908" width="140" height="32" rx="4" fill="#ffffff" fill-opacity="0.157"/>
  <text x="990.0" y="929" text-anchor="middle" fill="#ffffff" fill-opacity="0.53">Import<title>Disabled while no file is listed</title></text>
  <line x1="1044" y1="912" x2="1044" y2="936" stroke="#000000" stroke-opacity="0.25"/>
  <rect x="1044" y="908" width="32" height="32" rx="4" fill="#ffffff" fill-opacity="0.157"/>
  <text x="1055" y="928" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="10" fill="#ffffff">&#xE70D;<title>Import run settings</title></text>
  <rect x="1086" y="908" width="100" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="1136.0" y="929" text-anchor="middle" fill="#ffffff">Cancel</text>
  <g font-size="11" fill="#e0e0e0">
    <rect x="1220" y="40" width="212" height="760" rx="6" fill="#161616" stroke="#4a4a4a"/>
    <text x="1230" y="62" font-weight="600" fill="#ffffff">What the mockup shows</text>
    <text x="1230" y="84">1. Empty state: no file yet. It</text>
    <text x="1240" y="99">replaces the list and the settings</text>
    <text x="1240" y="114">until a file is added; then every</text>
    <text x="1240" y="129">file is selected.</text>
    <text x="1230" y="151">2. Add files… (Ctrl+O) opens the</text>
    <text x="1240" y="166">file picker; Open session… reads</text>
    <text x="1240" y="181">an import manifest (ME-15).</text>
    <text x="1230" y="203">3. Files dropped anywhere on the</text>
    <text x="1240" y="218">content are added.</text>
    <text x="1230" y="240">4. Save session and Import stay</text>
    <text x="1240" y="255">disabled until a file is listed;</text>
    <text x="1240" y="270">the Import run chevron is enabled.</text>
    <text x="1230" y="292">5. Files listed but none selected:</text>
    <text x="1240" y="307">the settings side says to select</text>
    <text x="1240" y="322">files to see their settings.</text>
    <text x="1230" y="344">Layers (WinUI 3 dark tokens):</text>
    <text x="1240" y="359">smoke 30 %, dialog base #202020,</text>
    <text x="1240" y="374">content on LayerFillColorAlt, the</text>
    <text x="1240" y="389">button bar on the base; cards,</text>
    <text x="1240" y="404">inputs and InfoBars above it.</text>
  </g>
</svg>
