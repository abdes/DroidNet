<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14">
  <title>Retarget in the Problems panel (dark theme)</title>
  <desc>The Problems panel with an unresolved reference selected. The details add a Retarget button, whose flyout holds the asset picker filtered to the field&#x27;s type and searching for the broken name.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.26"/></filter></defs>
  <rect width="1440" height="690" fill="#202020"/>
  <rect x="16" y="16" width="1180" height="654" fill="#ffffff" fill-opacity="0.03"/>
  <text x="28" y="40" font-weight="600" fill="#ffffff">Problems</text>
  <text x="28" y="72" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="12" fill="#ffffff">&#xE72C;</text>
  <text x="48" y="71" font-size="13" fill="#ffffff">Check scripts</text>
  <text x="28" y="104" font-weight="600" fill="#ffffff">Levels/Garage.oscene</text>
  <rect x="20" y="110" width="612" height="28" rx="4" fill="#ffffff" fill-opacity="0.059"/>
  <rect x="20" y="117" width="3" height="14" rx="1.5" fill="#4cc2ff"/>
  <text x="30" y="129" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#ff99a4">&#xEA39;</text>
  <text x="52" y="128" font-size="12" fill-opacity="0.773" fill="#ffffff">reference.unresolved</text>
  <text x="192" y="128" font-size="12" fill="#ffffff">/Props/Furniture/Chair.fbx/Chair.ogeo not found</text>
  <text x="624" y="128" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">nodes/Stool</text>
  <text x="30" y="159" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#ff99a4">&#xEA39;</text>
  <text x="52" y="158" font-size="12" fill-opacity="0.773" fill="#ffffff">reference.unresolved</text>
  <text x="192" y="158" font-size="12" fill="#ffffff">/Props/Furniture/Chair.fbx/Chair.ogeo not found</text>
  <text x="624" y="158" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">nodes/Bench</text>
  <text x="30" y="189" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#ff99a4">&#xEA39;</text>
  <text x="52" y="188" font-size="12" fill-opacity="0.773" fill="#ffffff">reference.unresolved</text>
  <text x="192" y="188" font-size="12" fill="#ffffff">/Props/Materials/Oak.omat not found</text>
  <text x="624" y="188" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">nodes/Table</text>
  <text x="28" y="226" font-weight="600" fill="#ffffff">Levels/Dock.oscene</text>
  <text x="30" y="251" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="14" fill="#ff99a4">&#xEA39;</text>
  <text x="52" y="250" font-size="12" fill-opacity="0.773" fill="#ffffff">reference.unresolved</text>
  <text x="192" y="250" font-size="12" fill="#ffffff">/Props/Furniture/Chair.fbx/Chair.ogeo not found</text>
  <text x="624" y="250" text-anchor="end" font-size="12" fill="#ffffff" fill-opacity="0.773">nodes/Seat</text>
  <line x1="640" y1="16" x2="640" y2="670" stroke="#ffffff" stroke-opacity="0.082"/>
  <text x="652" y="44" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">/Content/Levels/Garage.oscene</text>
  <text x="652" y="64" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">nodes/Stool, geometry</text>
  <text x="652" y="84" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">written:  /Props/Furniture/Chair.fbx/Chair.ogeo</text>
  <text x="652" y="104" font-size="12" font-family="Consolas, monospace" xml:space="preserve" fill="#ffffff">expects:  Geometry</text>
  <rect x="652" y="570" width="530" height="40" rx="4" fill="#ffffff" fill-opacity="0.051" stroke="#000000" stroke-opacity="0.1"/>
  <text x="664" y="595" font-size="13" fill="#ffffff">Explain</text>
  <text x="1156" y="594" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="10" fill="#ffffff" fill-opacity="0.77">&#xE70D;</text>
  <rect x="652" y="622" width="170" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="737.0" y="643" text-anchor="middle" fill="#ffffff">Open in code editor</text>
  <rect x="832" y="622" width="110" height="32" rx="4" fill="#60cdff"/>
  <text x="887.0" y="643" text-anchor="middle" fill="#000000">Retarget…</text>
  <rect x="652" y="122" width="500" height="436" rx="8" fill="#2b2b2b" stroke="#3a3a3a" filter="url(#shadow)"/>
  <rect x="664" y="134" width="476" height="32" rx="4" fill="#ffffff" fill-opacity="0.059" stroke="#ffffff" stroke-opacity="0.07"/>
  <line x1="665" y1="165.5" x2="1139" y2="165.5" stroke="#ffffff" stroke-opacity="0.545"/>
  <text x="675" y="155" fill="#ffffff">Chair</text>
  <text x="672" y="188" font-size="12" fill-opacity="0.773" fill="#ffffff">Props</text>
  <rect x="660" y="198" width="484" height="44" rx="4" fill="#ffffff" fill-opacity="0.059"/>
  <rect x="668" y="204" width="32" height="32" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="675" y="225" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="16" fill="#ffffff" fill-opacity="0.773">&#xF158;</text>
  <text x="710" y="217" font-size="13" fill="#ffffff">Furniture/Seats/Chair.fbx/Chair.ogeo</text>
  <text x="710" y="233" font-size="12" fill-opacity="0.773" fill="#ffffff">Geometry</text>
  <rect x="668" y="250" width="32" height="32" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="675" y="271" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="16" fill="#ffffff" fill-opacity="0.773">&#xF158;</text>
  <text x="710" y="263" font-size="13" fill="#ffffff">Furniture/Seats/ArmChair.fbx/ArmChair.ogeo</text>
  <text x="710" y="279" font-size="12" fill-opacity="0.773" fill="#ffffff">Geometry</text>
  <rect x="668" y="296" width="32" height="32" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="675" y="317" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="16" fill="#ffffff" fill-opacity="0.773">&#xF158;</text>
  <text x="710" y="309" font-size="13" fill="#ffffff">Furniture/Seats/Chair.fbx/Cushion.ogeo</text>
  <text x="710" y="325" font-size="12" fill-opacity="0.773" fill="#ffffff">Geometry</text>
  <text x="672" y="352" font-size="12" fill-opacity="0.773" fill="#ffffff">Content</text>
  <rect x="668" y="368" width="32" height="32" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="675" y="389" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="16" fill="#ffffff" fill-opacity="0.773">&#xF158;</text>
  <text x="710" y="381" font-size="13" fill="#ffffff">Props/Chair.fbx/Chair.ogeo</text>
  <text x="710" y="397" font-size="12" fill-opacity="0.773" fill="#ffffff">Geometry</text>
  <line x1="652" y1="424" x2="1152" y2="424" stroke="#3a3a3a" stroke-opacity="1"/>
  <rect x="668" y="438" width="18" height="18" rx="3" fill="#60cdff"/>
  <text x="671" y="452" font-family="Segoe Fluent Icons, Segoe MDL2 Assets" font-size="12" fill="#000000">&#xE73E;</text>
  <text x="696" y="452" font-size="13" fill="#ffffff">Also the 2 other references that name this path</text>
  <text x="696" y="474" font-size="12" fill-opacity="0.773" fill="#ffffff">nodes/Bench in Garage.oscene, nodes/Seat in Dock.oscene. One Undo step.</text>
  <rect x="1210" y="16" width="214" height="654" rx="6" fill="#161616" stroke="#4a4a4a"/>
  <text x="1220" y="38" font-size="11" font-weight="600" fill="#ffffff">What the mockup shows</text>
  <text x="1220" y="60" font-size="11" fill="#e0e0e0">1. Retarget sits with the details&#x27;</text>
  <text x="1230" y="75" font-size="11" fill="#e0e0e0">buttons, only on reference.unresolved</text>
  <text x="1230" y="90" font-size="11" fill="#e0e0e0">in a file the project can write. A</text>
  <text x="1230" y="105" font-size="11" fill="#e0e0e0">reference inside a read-only mount</text>
  <text x="1230" y="120" font-size="11" fill="#e0e0e0">has none.</text>
  <text x="1220" y="142" font-size="11" fill="#e0e0e0">2. The flyout holds the same</text>
  <text x="1230" y="157" font-size="11" fill="#e0e0e0">AssetPicker as AssetPickerButton,</text>
  <text x="1230" y="172" font-size="11" fill="#e0e0e0">filtered to the field&#x27;s type, grouped</text>
  <text x="1230" y="187" font-size="11" fill="#e0e0e0">by mount.</text>
  <text x="1220" y="209" font-size="11" fill="#e0e0e0">3. Search starts with the broken</text>
  <text x="1230" y="224" font-size="11" fill="#e0e0e0">name&#x27;s file stem: a renamed asset is</text>
  <text x="1230" y="239" font-size="11" fill="#e0e0e0">usually found at once.</text>
  <text x="1220" y="261" font-size="11" fill="#e0e0e0">4. Picking applies: one</text>
  <text x="1230" y="276" font-size="11" fill="#e0e0e0">RelocationEdit rewrites the written</text>
  <text x="1230" y="291" font-size="11" fill="#e0e0e0">text by the mount&#x27;s spelling (R2),</text>
  <text x="1230" y="306" font-size="11" fill="#e0e0e0">then the reference check reruns and</text>
  <text x="1230" y="321" font-size="11" fill="#e0e0e0">the row leaves.</text>
  <text x="1220" y="343" font-size="11" fill="#e0e0e0">5. The checkbox starts checked and</text>
  <text x="1230" y="358" font-size="11" fill="#e0e0e0">lists the others: a library rename</text>
  <text x="1230" y="373" font-size="11" fill="#e0e0e0">breaks many references with one text</text>
  <text x="1230" y="388" font-size="11" fill="#e0e0e0">(R9).</text>
  <text x="1220" y="410" font-size="11" fill="#e0e0e0">6. Undo is the ordinary Edit Undo.</text>
  <text x="1220" y="432" font-size="11" fill="#e0e0e0">7. In a shared Source mount the</text>
  <text x="1230" y="447" font-size="11" fill="#e0e0e0">newer-on-disk guard applies as for</text>
  <text x="1230" y="462" font-size="11" fill="#e0e0e0">any write.</text>
</svg>
