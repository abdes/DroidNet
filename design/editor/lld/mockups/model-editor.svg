    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6aa8"/><stop offset="1" stop-color="#3d3a72"/>
    </linearGradient>
  </defs>
