  <!-- Annotations -->
  <g font-size="11" fill="#e0e0e0">
    <rect x="400" y="596" width="520" height="300" rx="6" fill="#161616" stroke="#4a4a4a"/>
    <text x="412" y="616" font-weight="600" fill="#ffffff">What the mockup shows</text>
    <text x="412" y="638">1. Tabs: Car.glb opens beside the Harbor scene tab; no pane moves or resizes (ME-3).</text>
    <text x="412" y="658">2. Toolbar: the scene editor's ToolBar. Save (Ctrl+S) saves and reimports; Reimport is</text>
    <text x="424" y="674">disabled while the source is unchanged; Add to scene; Browse to asset (Ctrl+B); the</text>
    <text x="424" y="690">import status and problem count where the Play status sits; Settings (ME-8).</text>
    <text x="412" y="710">3. Viewport, viewing profile: view camera, view mode, Show, Frame and the status strips</text>
    <text x="424" y="726">stay; the tool strip, transform space, snapping, layout and Maximize are hidden (ME-9).</text>
    <text x="412" y="746">4. Import settings: a panel of the document, beside the viewport. Set values carry the</text>
    <text x="424" y="762">override bar and reset; the Selected mesh group follows the selection (ME-5).</text>
    <text x="424" y="778">Source shows Scene only for a glTF file with several scenes (M11).</text>
    <text x="412" y="798">5. Scene Explorer: the car's nodes, read-only; its foot buttons are disabled.</text>
    <text x="412" y="818">6. Properties: the selected node, read-only, "in Car.glb (model)".</text>
    <text x="412" y="838">7. Bottom panes unchanged; the Problems tab lists the import's problems when the</text>
    <text x="424" y="854">status link is clicked.</text>
    <text x="412" y="874">8. Activating Harbor shows the scene again; loaded assets stay loaded (ME-2).</text>
  </g>
</svg>
