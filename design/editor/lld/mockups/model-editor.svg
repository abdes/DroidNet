<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="13">
  <title>Model Editor in the project workspace (dark theme)</title>
  <desc>The project workspace with the Car.glb model document active beside the Harbor scene tab. The layout is the scene editor's: document area on the left, Scene Explorer and Properties docked on the right, Content Explorer and its sibling panes docked below. The model document has the scene editor's toolbar with Save, Reimport, Add to scene, Browse to asset, the import status with its problem count, and Settings. Its viewport uses the viewing profile: view camera, view mode, Show and Frame stay, and the editing tools, snapping, layout and maximize controls are gone. The import settings panel sits right of the viewport: the Source group's Scene setting, shown because Car.glb holds two glTF scenes, set to Day over the default Night; Units and axes with the detected file facts and Units overridden to Custom; the other groups collapsed; and the selected mesh's geometry defaults. The Scene Explorer shows the car's nodes read-only with Body selected; Properties shows Body read-only with "in Car.glb (model)".</desc>
