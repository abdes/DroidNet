default_install_hook_types:
  - pre-commit
  - commit-msg

# Immutable capture records and saved-scene fixtures retain their recorded bytes.
exclude: '^projects/Oxygen\.Engine/(design/vortex/plan/baselines/(ex07e-20260924/(cpu-submission|point-hardware-pcf)|ex07e-20260925/cross-view-sharing)/|Examples/LightBench/Test/Data/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.verified\.
      - id: trailing-whitespace
        exclude: \.verified\.
      # Keep these exclusions aligned with the -text rules in .gitattributes.
      - id: mixed-line-ending
        name: Normalize text to LF
        args: [--fix=lf]
        exclude: '(?i)\.(bat|cmd|pak|7z|br|gz|tar|zip|pdf|gif|ico|jpg|png|psd|webp|woff2|exe)$'
      - id: mixed-line-ending
        name: Normalize batch scripts to CRLF
        args: [--fix=crlf]
        files: '(?i)\.(bat|cmd)$'

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.19.3
    hooks:
      - id: gersemi

  # Disabled for now - it's too slow
  #
  #   - repo: local
  #     hooks:
  #     # Use dotnet format already installed locally
  #     - id: dotnet-format
  #       name: C# dotnet-format
  #       language: system
  #       entry: dotnet format --include
  #       types_or: ["c#"]

  - repo: local
    hooks:
      - id: prettier
        name: Prettier formatting
        language: node
        entry: prettier --write
        additional_dependencies: ["prettier@3.9.8"]
        types: [file]
        files: '\.(css|html|json|jsonc|md|ts|tsx|yaml|yml)$'
        stages: [pre-commit]
        require_serial: true
      - id: oxyformat
        name: Oxygen C++ formatting
        language: python
        entry: python projects/Oxygen.Engine/tools/oxytools/run_oxyformat.py --project-root projects/Oxygen.Engine --paths-from-cwd
        additional_dependencies:
          ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "rich>=13.9,<15"]
        types: [file]
        files: '(?i)^projects/Oxygen\.Engine/(src/Oxygen|Examples)/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|inc|inl|ipp|tpp|ixx|cppm)$'
        stages: [pre-commit]
        require_serial: true
      # Use XamlStyler already installed locally as a dotnet tool
      - id: xaml-styler
        name: XAML styler
        language: system
        entry: dotnet xstyler -f
        types: [file]
        files: \.xaml$
